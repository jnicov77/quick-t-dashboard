<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistenc-IA JusTTime</title>
  <style>
    :root{--accent:#10B981;--primary:#1A1D23;--muted:#64748B}
    body{font-family:sans-serif;background:#F8FAFC;margin:0;padding:20px}
    .empty{color:var(--muted);text-align:center;padding:40px}
    table{width:100%;border-collapse:collapse}
    th{background:#f1f5f9;text-align:left;padding:12px}
    td{padding:12px;border-bottom:1px solid #e2e8f0}
  </style>
</head>
<body>
  <h1>JusTTime</h1>
  <p id="status">Conectando...</p>
  <table>
    <thead><tr><th>Nombre</th><th>UID</th><th>Área</th><th>Acción</th><th>Hora</th></tr></thead>
    <tbody id="eventsBody"><tr><td colspan="5" class="empty">Cargando...</td></tr></tbody>
  </table>
  <script>
    document.getElementById('status').textContent = 'JS OK - Cargando datos...';
    var URL = 'https://script.google.com/macros/s/AKfycbyCUyp9K9AD7d7V4ir6JkC-kBa8w4ojhrVa3Tskx1aZCJBpbJ1kvBW_4ueO69ACPPzgiw/exec';
    fetch(URL + '?action=today')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        document.getElementById('status').textContent = 'Eventos: ' + d.length;
        var tbody = document.getElementById('eventsBody');
        tbody.innerHTML = '';
        d.forEach(function(e) {
          tbody.innerHTML += '<tr><td>' + (e.nombre || 'Sin nombre') + '</td><td>' + (e.uid || '—') + '</td><td>' + (e.area || '—') + '</td><td>' + (e.action || '—') + '</td><td>' + (e.timestamp || '—') + '</td></tr>';
        });
      })
      .catch(function(err) {
        document.getElementById('status').textContent = 'Error: ' + err.message;
      });
  </script>
</body>
</html>
