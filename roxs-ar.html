<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0D0D0D">
<title>ROXS Garden AR</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:system-ui}
  #cam{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
  #world{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;perspective:800px;pointer-events:none}
  #hud{position:absolute;bottom:80px;left:50%;width:280px;margin-left:-140px;padding:18px 20px;background:rgba(13,13,13,.92);border:1px solid rgba(0,212,212,.5);border-radius:20px;color:#fff;display:none;text-align:center;backdrop-filter:blur(12px);box-shadow:0 0 50px rgba(0,212,212,.2),0 40px 100px rgba(0,0,0,.7),0 10px 30px rgba(0,212,212,.1);transform:translateZ(200px) rotateX(-5deg);animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateZ(200px) rotateX(-5deg) translateY(0)}50%{transform:translateZ(200px) rotateX(-5deg) translateY(-10px)}}
  #hud .val{font-size:26px;font-weight:700;color:#00D4D4;line-height:1.4}
  #hud .label{font-size:9px;color:#A9AAA9;letter-spacing:.12em;display:block}
  #start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(13,13,13,.95);border:1px solid #00D4D4;border-radius:20px;padding:30px;color:#fff;text-align:center}
  #start h2{color:#00D4D4;margin:0 0 8px}
  #start p{color:#A9AAA9;font-size:12px;margin:0 0 16px}
  #start button{background:#00D4D4;color:#0D0D0D;border:0;padding:14px 30px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
  #exit{position:fixed;top:16px;right:16px;z-index:20;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:8px;font-size:11px;cursor:pointer;display:none}
</style>
</head>
<body>
<video id="cam" autoplay playsinline></video>

<div id="start">
  <h2>🥽 ROXS Garden AR</h2>
  <p>Dashboard flotando sobre tu cultivo en tiempo real</p>
  <button onclick="startAR()">Iniciar AR</button>
</div>

<div id="world">
  <div id="hud">
    <span class="label">🌡️ TEMPERATURA</span>
    <span class="val" id="arTemp">--°</span>
    <span class="label" style="margin-top:6px">💧 HUMEDAD</span>
    <span class="val" id="arHum">--%</span>
    <span class="label" style="margin-top:6px">📊 VPD</span>
    <span class="val" id="arVPD">--</span>
  </div>
</div>

<button id="exit" onclick="stopAR()">✕ Salir</button>

<script>
var stream=null, prev=null;
try{prev=JSON.parse(localStorage.getItem('roxs_last')||'null');}catch(e){}

function updateHUD(){
  try{prev=JSON.parse(localStorage.getItem('roxs_last')||'null');}catch(e){}
  if(prev){
    document.getElementById('arTemp').textContent=prev.t.toFixed(1)+'°C';
    document.getElementById('arHum').textContent=prev.h.toFixed(1)+'%';
    document.getElementById('arVPD').textContent=prev.v.toFixed(2)+' kPa';
  }
}

async function startAR(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    document.getElementById('cam').srcObject=stream;
    document.getElementById('start').style.display='none';
    document.getElementById('hud').style.display='block';
    document.getElementById('exit').style.display='block';
    updateHUD();
    setInterval(updateHUD,5000);
  }catch(e){
    alert('Permití el acceso a la cámara para AR');
  }
}

function stopAR(){
  if(stream){stream.getTracks().forEach(t=>t.stop());}
  location.reload();
}
</script>
</body>
</html>
