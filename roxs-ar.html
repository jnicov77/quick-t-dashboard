<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0D0D0D">
<title>ROXS Garden AR</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:system-ui}
  #cam{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
  #world{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;perspective:1000px;pointer-events:none}
  #hud{position:absolute;bottom:180px;left:50%;width:280px;margin-left:-140px;text-align:center;display:none;filter:drop-shadow(0 0 15px rgba(0,0,0,.6))}
  #gauges{display:flex;justify-content:center;gap:16px}
  .gauge{position:relative;width:70px;height:70px}
  .gauge svg{width:70px;height:70px}
  .gauge .ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:4}
  .gauge .ring-fill{fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s}
  .gauge .val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:700}
  .gauge .lbl{font-size:7px;letter-spacing:.1em;margin-top:2px;text-align:center}
  #rec{font-size:10px;margin-top:10px;font-weight:600}
  #start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(13,13,13,.95);border:1px solid #00D4D4;border-radius:20px;padding:30px;color:#fff;text-align:center}
  #start h2{color:#00D4D4;margin:0 0 8px}
  #start p{color:#A9AAA9;font-size:12px;margin:0 0 16px}
  #start button{background:#00D4D4;color:#0D0D0D;border:0;padding:14px 30px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
  #exit{position:fixed;top:16px;right:16px;z-index:20;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);color:#fff;padding:6px 12px;border-radius:8px;font-size:10px;cursor:pointer;display:none}
</style>
</head>
<body>
<video id="cam" autoplay playsinline></video>

<div id="start">
  <h2>🥽 ROXS Garden AR</h2>
  <p>Datos flotando sobre tu cultivo</p>
  <button onclick="startAR()">Iniciar AR</button>
</div>

<div id="world">
  <div id="hud">
    <div id="gauges">
      <div class="gauge">
        <svg viewBox="0 0 70 70">
          <circle class="ring-bg" cx="35" cy="35" r="30"/>
          <circle class="ring-fill" id="ringT" cx="35" cy="35" r="30" stroke="#D4A843" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
        </svg>
        <div class="val" style="color:#D4A843" id="arTemp">--</div>
      </div>
      <div class="gauge">
        <svg viewBox="0 0 70 70">
          <circle class="ring-bg" cx="35" cy="35" r="30"/>
          <circle class="ring-fill" id="ringH" cx="35" cy="35" r="30" stroke="#00D4D4" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
        </svg>
        <div class="val" style="color:#00D4D4" id="arHum">--</div>
      </div>
      <div class="gauge">
        <svg viewBox="0 0 70 70">
          <circle class="ring-bg" cx="35" cy="35" r="30"/>
          <circle class="ring-fill" id="ringV" cx="35" cy="35" r="30" stroke="#B388FF" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
        </svg>
        <div class="val" style="color:#B388FF" id="arVPD">--</div>
      </div>
    </div>
    <div style="display:flex;justify-content:center;gap:16px;margin-top:3px">
      <div class="lbl" style="color:#D4A843">TEMP</div>
      <div class="lbl" style="color:#00D4D4">HUM</div>
      <div class="lbl" style="color:#B388FF">VPD</div>
    </div>
    <div id="rec" style="color:#00E676">✅ Condiciones ideales</div>
  </div>
</div>

<button id="exit" onclick="stopAR()">✕</button>

<script>
var stream=null, prev=null, gyro={x:0,y:0};
try{prev=JSON.parse(localStorage.getItem('roxs_last')||'null');}catch(e){}

function getRec(t,h,v){
  if(t>30||t<15)return{color:'#F43F5E',txt:'⚠️ Temperatura fuera de rango'};
  if(h>85||h<35)return{color:'#F4A83F',txt:'⚠️ Humedad fuera de rango'};
  if(v>1.8||v<0.3)return{color:'#F4A83F',txt:'⚠️ VPD fuera de rango'};
  if(t>28||h<45)return{color:'#F4A83F',txt:'⚡ Condiciones al límite'};
  return{color:'#00E676',txt:'✅ Condiciones ideales'};
}

var circ=2*Math.PI*30; // 188.5

function updateHUD(){
  try{prev=JSON.parse(localStorage.getItem('roxs_last')||'null');}catch(e){}
  if(prev){
    document.getElementById('arTemp').textContent=prev.t.toFixed(1)+'°';
    document.getElementById('arHum').textContent=prev.h.toFixed(1)+'%';
    document.getElementById('arVPD').textContent=prev.v.toFixed(2);
    // Rings: T 0-50°C, H 0-100%, V 0-3 kPa
    document.getElementById('ringT').style.strokeDashoffset=circ-(prev.t/50*circ);
    document.getElementById('ringH').style.strokeDashoffset=circ-(prev.h/100*circ);
    document.getElementById('ringV').style.strokeDashoffset=circ-(prev.v/3*circ);
    var r=getRec(prev.t,prev.h,prev.v);
    var re=document.getElementById('rec');
    re.textContent=r.txt;
    re.style.color=r.color;
  }
}

var hud=document.getElementById('hud');
window.addEventListener('deviceorientation',function(e){
  if(!e.beta)return;
  var ty=(e.beta||0)*1;
  ty=Math.max(-15,Math.min(15,ty));
  gyro.y+=(ty-gyro.y)*0.3;
  hud.style.transform='translateZ(400px) translateY('+(gyro.y*3)+'px)';
});

async function startAR(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    document.getElementById('cam').srcObject=stream;
    document.getElementById('start').style.display='none';
    document.getElementById('hud').style.display='block';
    document.getElementById('exit').style.display='block';
    try{document.documentElement.requestFullscreen();}catch(e){}
    updateHUD();
    setInterval(updateHUD,5000);
    if(typeof DeviceOrientationEvent.requestPermission==='function') DeviceOrientationEvent.requestPermission();
  }catch(e){alert('Permití cámara y giroscopio');}
}

function stopAR(){
  if(stream){stream.getTracks().forEach(t=>t.stop());}
  location.reload();
}
</script>
</body>
</html>
