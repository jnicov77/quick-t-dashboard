<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>
<h1>TEST</h1>
<div id="result">Esperando...</div>
<script>
'use strict';
document.getElementById('result').textContent = 'JS RUNS: ' + new Date().toISOString();
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCUyp9K9AD7d7V4ir6JkC-kBa8w4ojhrVa3Tskx1aZCJBpbJ1kvBW_4ueO69ACPPzgiw/exec';
fetch(APPS_SCRIPT_URL + '?action=today').then(r=>r.json()).then(d=>{
  document.getElementById('result').textContent = 'EVENTOS: ' + d.length;
}).catch(e=>{
  document.getElementById('result').textContent = 'ERROR: ' + e.message;
});
</script>
</body></html>
