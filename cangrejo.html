<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cangrejo IA - Selección de Cerebro</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
.container { width: 100%; max-width: 480px; background: rgba(30, 41, 59, 0.7); border-radius: 20px; padding: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
h1 { font-size: 1.4rem; text-align: center; margin-bottom: 12px; color: #38bdf8; }
.config { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; background: rgba(15,23,42,0.6); padding: 12px; border-radius: 12px; }
input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.85rem; }
label { font-size: 0.75rem; color: #94a3b8; font-weight: bold; }
.chat-box { height: 220px; overflow-y: auto; background: #0f172a; border-radius: 10px; padding: 10px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #1e293b; }
.msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; font-size: 0.85rem; word-break: break-word; }
.user { background: #0284c7; align-self: flex-end; }
.bot { background: #334155; align-self: flex-start; color: #38bdf8; }
.input-group { display: flex; gap: 8px; }
button { padding: 10px 16px; border-radius: 6px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
button:hover { background: #7dd3fc; }
</style>
</head>
<body>
<div class="container">
<h1>🦀 Cangrejo Agente IA</h1>
<div class="config">
<label for="ipEsp">IP ESP32:</label>
<input type="text" id="ipEsp" placeholder="192.168.X.X">
<label for="apiKey">OpenRouter API Key:</label>
<input type="password" id="apiKey" placeholder="sk-or-v1-...">
<label for="modelSelect">Selecciona el Cerebro (Modelo):</label>
<select id="modelSelect" onchange="toggleCustomModel(this.value)">
<option value="google/gemini-2.0-flash-lite-001">Gemini 2.0 Flash Lite (Rápido / Gratis)</option>
<option value="google/gemini-2.0-flash-001">Gemini 2.0 Flash (Recomendado)</option>
<option value="qwen/qwen-2.5-7b-instruct">Qwen 2.5 7B Instruct</option>
<option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B Instruct</option>
<option value="deepseek/deepseek-r1">DeepSeek R1</option>
<option value="custom">-- Otro modelo personalizado --</option>
</select>
<input type="text" id="customModel" placeholder="Escribe el id del modelo (ej: anthropic/claude-3.5-sonnet)" style="display: none; margin-top: 5px;">
</div>
<div class="chat-box" id="chatBox">
<div class="msg bot">¡Hola! Soy tu cangrejo. Selecciona el cerebro con el que quieres que piense y hablemos.</div>
</div>
<div class="input-group">
<input type="text" id="userInput" placeholder="Habla con tu cangrejo..." onkeypress="if(event.key==='Enter') interactuar()">
<button onclick="interactuar()">Enviar</button>
</div>
</div>
<script>
// Cargar configuraciones previamente guardadas
document.getElementById('ipEsp').value = localStorage.getItem('esp_ip') || '';
document.getElementById('apiKey').value = localStorage.getItem('openrouter_key') || '';
const savedModel = localStorage.getItem('openrouter_model') || 'google/gemini-2.0-flash-001';
const selectEl = document.getElementById('modelSelect');
if ([...selectEl.options].some(o => o.value === savedModel)) {
selectEl.value = savedModel;
} else {
selectEl.value = 'custom';
document.getElementById('customModel').value = savedModel;
document.getElementById('customModel').style.display = 'block';
}
function toggleCustomModel(val) {
document.getElementById('customModel').style.display = (val === 'custom') ? 'block' : 'none';
}
async function interactuar() {
const inputEl = document.getElementById('userInput');
const text = inputEl.value.trim();
const ip = document.getElementById('ipEsp').value.trim();
const apiKey = document.getElementById('apiKey').value.trim();
// Obtener el modelo seleccionado
let selectedModel = document.getElementById('modelSelect').value;
if (selectedModel === 'custom') {
selectedModel = document.getElementById('customModel').value.trim();
}
if (!text) return;
if (!apiKey) { alert("Ingresa tu API Key de OpenRouter"); return; }
if (!selectedModel) { alert("Selecciona o escribe un modelo"); return; }
// Guardar configuración
localStorage.setItem('esp_ip', ip);
localStorage.setItem('openrouter_key', apiKey);
localStorage.setItem('openrouter_model', selectedModel);
appendMessage(text, 'user');
inputEl.value = '';
try {
// Consulta a la API de OpenRouter enviando el cerebro/modelo elegido
const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
method: "POST",
headers: {
"Authorization": `Bearer ${apiKey}`,
"Content-Type": "application/json",
"HTTP-Referer": window.location.origin,
"X-Title": "Cangrejo IA Companion"
},
body: JSON.stringify({
model: selectedModel, // <-- AQUÍ SE LE PASA EL CEREBRO ELEGIDO
response_format: { type: "json_object" },
messages: [
{
role: "system",
content: `Eres un cangrejo robótico inteligente de escritorio. Respondes SIEMPRE en un objeto JSON estricto con esta estructura exacta:
{
"texto": "Tu respuesta corta en español (máx 15 palabras)",
"frecuencia": número entero entre 600 y 1800 (Hz para el tono de la bocina),
"duracion": número entero entre 200 y 800 (milisegundos que suena),
"mover": true o false (si debe mover el motor),
"luces": true o false (si debe encender los LEDs)
}`
},
{ role: "user", content: text }
]
})
});
const data = await response.json();
if (data.error) {
throw new Error(data.error.message || "Error devuelto por la API");
}
// Extraer el JSON generado por el modelo seleccionado
const content = data.choices[0].message.content;
const aiData = JSON.parse(content);
appendMessage(aiData.texto, 'bot');
sintetizarVoz(aiData.texto);
// Transmitir las órdenes físicas resultantes a la ESP32
if (ip) {
const cleanIp = ip.replace(/\/$/, "");
fetch(`http://${cleanIp}/ia-accion`, {
method: 'POST',
mode: 'no-cors',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
duracion: aiData.duracion || 400,
frecuencia: aiData.frecuencia || 1000,
mover: !!aiData.mover,
luces: !!aiData.luces
})
}).catch(e => console.log("Comando enviado al hardware"));
}
} catch (error) {
console.error(error);
appendMessage(`Error (${selectedModel}): ${error.message}`, 'bot');
}
}
function appendMessage(text, sender) {
const box = document.getElementById('chatBox');
const msgDiv = document.createElement('div');
msgDiv.className = `msg ${sender}`;
msgDiv.textContent = text;
box.appendChild(msgDiv);
box.scrollTop = box.scrollHeight;
}
function sintetizarVoz(texto) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(texto);
utterance.lang = 'es-ES';
utterance.pitch = 1.2;
window.speechSynthesis.speak(utterance);
}
}
</script>
</body>
</html>
