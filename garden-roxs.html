<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROXS Lab — Monitor Ambiental</title>
<style>
:root { --bg:#08080C; --fg:#FFF; --dim:#666; --cyan:#00D4D4; --green:#00E676; --purple:#B388FF; --gold:#F9A825; --panel:rgba(12,12,16,.9); --radius:14px; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.dash { display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-rows:auto auto auto; gap:12px; max-width:1100px; width:100%; }
/* ── TITLE BAR ── */
.title-bar { grid-column:1/4; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }

  .mini-clock { background:var(--panel); border:1px solid rgba(179,136,255,.15); border-radius:var(--radius); padding:10px 16px; text-align:center; box-shadow:0 0 20px rgba(179,136,255,.10); }
  .mc-time { font-size:20px; font-weight:600; color:var(--purple); letter-spacing:.03em; }
  .mc-date { font-size:9px; color:var(--dim); margin-top:2px; }

.title-box { border:1.5px solid; border-image:linear-gradient(90deg,var(--cyan),var(--purple))1; border-radius:var(--radius); padding:10px 18px; box-shadow: 0 0 30px rgba(0,212,212,.15), 0 0 60px rgba(179,136,255,.12); }
.title-box h1 { font-size:32px; font-weight:700; background:linear-gradient(90deg,var(--cyan),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.title-box .sub { font-size:10px; color:var(--dim); letter-spacing:.05em; }
.online { background:rgba(0,230,118,.12); color:var(--green); padding:8px 16px; border-radius:20px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; box-shadow:0 0 25px rgba(0,230,118,.25), 0 0 40px rgba(0,230,118,.10); }
.online::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
/* ── GAUGE PANELS ── */
.gauge-panel { background:var(--panel); border-radius:var(--radius); padding:18px; border:1px solid rgba(255,255,255,.08); position:relative; overflow:hidden; }
.gauge-panel.temp { box-shadow: 0 0 20px rgba(0,212,212,.15), 0 0 50px rgba(0,212,212,.10), 0 0 80px rgba(0,212,212,.05), inset 0 0 20px rgba(0,212,212,.03); border-color: rgba(0,212,212,.15); }
.gauge-panel.hum  { box-shadow: 0 0 20px rgba(0,230,118,.15), 0 0 50px rgba(0,230,118,.10), 0 0 80px rgba(0,230,118,.05), inset 0 0 20px rgba(0,230,118,.03); border-color: rgba(0,230,118,.15); }
.gauge-panel.vpd  { box-shadow: 0 0 20px rgba(179,136,255,.18), 0 0 50px rgba(179,136,255,.12), 0 0 80px rgba(179,136,255,.06), inset 0 0 20px rgba(179,136,255,.04); border-color: rgba(179,136,255,.15); }
.gauge-panel .icon { position:absolute; top:12px; right:14px; font-size:18px; opacity:.4; }
.gauge-panel .val { font-size:42px; font-weight:700; letter-spacing:-.02em; }
.gauge-panel .unit { font-size:14px; opacity:.6; margin-left:4px; }
.gauge-panel .label { font-size:11px; color:var(--dim); margin-top:4px; }
.gauge-panel .mini-chart { margin-top:12px; height:50px; opacity:.5; }
.gauge-panel .status-row { display:flex; align-items:center; gap:12px; margin-top:10px; }
.gauge-panel .status-badge { font-size:11px; font-weight:600; padding:3px 10px; border-radius:10px; }

  .gauge-big { width:100px; height:100px; margin:8px auto 0; }
  .gauge-big svg { width:100%; height:100%; transform:rotate(-90deg); }
  .gauge-big .bg-ring { fill:none; stroke:rgba(255,255,255,.04); stroke-width:8; }
  .gauge-big .fill-ring { fill:none; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .8s; }

.gauge-panel .mini-gauge { width:48px; height:48px; margin-left:auto; }
.gauge-panel .mini-gauge svg { width:100%; height:100%; transform:rotate(-90deg); }
.gauge-panel .mini-gauge .bg { fill:none; stroke:rgba(255,255,255,.06); stroke-width:5; }
.gauge-panel .mini-gauge .arc { fill:none; stroke-width:5; stroke-linecap:round; }
/* colors */
.temp .val { color:var(--cyan); } .temp .status-badge { background:rgba(0,212,212,.12); color:var(--cyan); }
.hum  .val { color:var(--green); } .hum  .status-badge { background:rgba(0,230,118,.12); color:var(--green); }
.vpd  .val { color:var(--purple); } .vpd  .status-badge { background:rgba(179,136,255,.12); color:var(--purple); }
/* ── BOTTOM: CLOCK + CALENDAR ── */
.clock-box { display:none;  background:var(--panel); border-radius:var(--radius); padding:22px; border:1px solid rgba(179,136,255,.12); text-align:center; box-shadow:0 0 50px rgba(179,136,255,.18), 0 0 80px rgba(179,136,255,.06); }
.clock-box .time { font-size:50px; font-weight:300; letter-spacing:.03em; color:var(--purple); }
.clock-box .date { font-size:13px; color:var(--dim); margin-top:6px; }
.cal-box { background:var(--panel); border-radius:var(--radius); padding:18px; border:1px solid rgba(0,212,212,.10); box-shadow:0 0 35px rgba(0,212,212,.12), 0 0 60px rgba(0,212,212,.04); }
.cal-box h3 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
.cal-box .month-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.cal-box .month-row span { font-size:14px; font-weight:600; color:var(--cyan); }
.cal-box .month-row button { background:none; border:none; color:var(--dim); cursor:pointer; font-size:16px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; text-align:center; font-size:11px; }
.cal-grid .dh { color:var(--dim); padding:3px 0; font-size:9px; }
.cal-grid .d { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:4px; cursor:pointer; }
.cal-grid .d:hover { background:rgba(255,255,255,.04); }
.cal-grid .d.today { background:var(--cyan); color:#000; font-weight:700; }
/* ── RESPONSIVE ── */
@media(max-width:700px) {
  .dash { grid-template-columns:1fr 1fr; grid-template-rows:auto; }
  .title-bar { grid-column:1/3; }
  .gauge-panel { grid-column:span 1; }
  .clock-box, .cal-box { grid-column:1/4; }
  .gauge-panel .val { font-size:32px; }
}
</style>
</head>
<body>
<div class="dash">

  <!-- TITLE (CENTERED) -->
  <div class="title-bar">
    <div class="title-box">
      <h1>ROXS</h1>
      <div class="sub">Monitoreo ambiental y seguimiento inteligente de tus cultivos</div>
    </div>
    <div class="mini-clock">
      <div class="mc-time" id="liveTime">--:--:--</div>
      <div class="mc-date" id="liveDate">---</div>
    </div>
    <div class="online" id="statusDot">EN LÍNEA</div>
  </div>

  <!-- TEMP -->
  <div class="gauge-panel temp">
    <div class="icon">🌡️</div>
    <div class="val" id="vTemp">--<span class="unit">°C</span></div>
    <div class="label">Temperatura</div>
    <div class="gauge-big"><svg viewBox="0 0 120 120"><circle class="bg-ring" cx="60" cy="60" r="52"/><circle class="fill-ring" id="gTemp" cx="60" cy="60" r="52" stroke="#00D4D4" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg></div>
    <div class="status-row">
      <div class="status-badge" id="sTemp">--</div>
    </div>
  </div>

  <!-- HUM -->
  <div class="gauge-panel hum">
    <div class="icon">💧</div>
    <div class="val" id="vHum">--<span class="unit">%</span></div>
    <div class="label">Humedad Relativa</div>
    <div class="gauge-big"><svg viewBox="0 0 120 120"><circle class="bg-ring" cx="60" cy="60" r="52"/><circle class="fill-ring" id="gHum" cx="60" cy="60" r="52" stroke="#00E676" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg></div>
    <div class="status-row">
      <div class="status-badge" id="sHum">--</div>
    </div>
  </div>

  <!-- VPD -->
  <div class="gauge-panel vpd">
    <div class="icon">📊</div>
    <div class="val" id="vVPD">--<span class="unit">kPa</span></div>
    <div class="label">VPD — Déficit de Presión de Vapor</div>
    <div class="gauge-big"><svg viewBox="0 0 120 120"><circle class="bg-ring" cx="60" cy="60" r="52"/><circle class="fill-ring" id="gVPD" cx="60" cy="60" r="52" stroke="#B388FF" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg></div>
    <div class="status-row">
      <div class="status-badge" id="sVPD">--</div>
    </div>
  </div>



  <!-- CALENDAR -->
  <div class="cal-box">
    <h3>📅 CALENDARIO DE CONTROL</h3>
    <div class="month-row">
      <button onclick="calShift(-1)">‹</button>
      <span id="calMonth">---</span>
      <button onclick="calShift(1)">›</button>
    </div>
    <div class="cal-grid" id="calGridDD"></div>
  </div>

</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycby8Abmtcw_qL7_gRersfAwJzgKKOuzbxozedmIACIn-3BvfLoBPXQqWER4qaMsM-yU/exec';
const DEV = new URLSearchParams(location.search).get('device')||'quick-t-garden-v1';
const C157 = 2*Math.PI*52; // big gauge circumference
let calOffset = 0, history = [];

// ── CLOCK ──
function tick() {
  var d = new Date(), t = d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  document.getElementById('liveTime').textContent = t;
  document.getElementById('liveDate').textContent = d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
tick(); setInterval(tick,1000);

// ── GAUGES ──
function setMiniGauge(id,val,max){ document.getElementById(id).setAttribute('stroke-dashoffset',C157*(1-Math.min(val/max,1))); }
// mini charts removed — using big gauge rings instead
async function fetchData() {
  try {
    var r = await fetch(API+'?action=ultima&device='+DEV,{cache:'no-store'}), d = await r.json();
    var t=parseFloat(d.temp), h=parseFloat(d.hum), v=parseFloat(d.vpd);
    document.getElementById('vTemp').innerHTML = t.toFixed(1)+'<span class="unit">°C</span>';
    document.getElementById('vHum').innerHTML = h.toFixed(0)+'<span class="unit">%</span>';
    document.getElementById('vVPD').innerHTML = v.toFixed(2)+'<span class="unit">kPa</span>';
    setMiniGauge('gTemp',t,50); setMiniGauge('gHum',h,100); setMiniGauge('gVPD',v,3);
    var sT=document.getElementById('sTemp'); sT.textContent=t>30?'ALTA':t<18?'BAJA':'ESTABLE';
    sT.style.background=t>30?'rgba(249,168,37,.15)':t<18?'rgba(255,82,82,.15)':'rgba(0,212,212,.12)';
    sT.style.color=t>30?'#F9A825':t<18?'#FF5252':'#00D4D4';
    var sH=document.getElementById('sHum'); sH.textContent=h>=50&&h<=70?'ÓPTIMO':h<40?'BAJO':'ALTO';
    sH.style.background=h>=50&&h<=70?'rgba(0,230,118,.12)':h<40?'rgba(255,82,82,.15)':'rgba(249,168,37,.15)';
    sH.style.color=h>=50&&h<=70?'#00E676':h<40?'#FF5252':'#F9A825';
    var sV=document.getElementById('sVPD');
    if(v>=0.8&&v<=1.2){sV.textContent='NORMAL — Rango óptimo 0.8-1.2';sV.style.background='rgba(0,230,118,.12)';sV.style.color='#00E676';}
    else{sV.textContent=v<0.5?'BAJO':'ALTO';sV.style.background='rgba(249,168,37,.15)';sV.style.color='#F9A825';}
    // history for future use
    history.push({t,h,v});
    if(history.length>60)history.shift();
  }catch(e){console.warn(e)}
}
fetchData(); setInterval(fetchData,60000);

// ── CALENDAR ──
function renderCal() {
  var now = new Date(); now.setMonth(now.getMonth()+calOffset);
  var y=now.getFullYear(), m=now.getMonth(), dim=new Date(y,m+1,0).getDate(), fd=new Date(y,m,1).getDay(), today=new Date().getDate();
  var months=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  document.getElementById('calMonth').textContent = months[m]+' '+y;
  var h='', days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  days.forEach(function(d){h+='<div class="dh">'+d+'</div>';});
  for(var i=0;i<fd;i++)h+='<div class="d"></div>';
  for(var d=1;d<=dim;d++){
    var isToday=(calOffset===0&&d===today);
    h+='<div class="d'+(isToday?' today':'')+'">'+d+'</div>';
  }
  document.getElementById('calGridDD').innerHTML=h;
}
function calShift(n){calOffset+=n;renderCal();}
renderCal();
</script>
</body>
</html>
