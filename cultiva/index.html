<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cultiva con ROXS: aprende a cultivar jugando, lleva la trazabilidad de tus cultivos y pregúntale a Widcy.">
<title>Cultiva con ROXS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#510C82">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cultiva ROXS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">

<style>
/* Layout: una columna móvil (máx 520px), camino zigzag tipo Duolingo; tarjetas con contorno morado y sombra desplazada como el manual de marca */
:root{
  --bg:#FFF5E6; --surface:#FFFDF8; --ink:#2A0A45; --muted:#7A6690; --line:#EADBC4;
  --primary:#510C82; --primary-deep:#2E0549; --on-primary:#FFF5E6;
  --go:#0B8457; --go-deep:#065A3B; --go-soft:#D7F0E3;
  --sun:#FFC100; --sun-deep:#C08E00; --on-sun:#2A0A45;
  --bad:#D7354A; --bad-deep:#9C1F31; --bad-soft:#FBE1E4;
  --locked:#E8DBC6; --locked-deep:#CDBBA0; --locked-ink:#A08B6C;
  --leaf:#2E9E5B; --leaf-deep:#1C6E3D; --soil:#5B3A24; --bud:#B8D96A;
  --outline:#510C82;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#160A24; --surface:#22113A; --ink:#FFF5E6; --muted:#B8A5D2; --line:#3B2558;
  --primary:#8E44D1; --primary-deep:#4E1680; --on-primary:#FFF5E6;
  --go:#14A56F; --go-deep:#0A6845; --go-soft:#123A2C;
  --sun:#FFC100; --sun-deep:#B88800; --on-sun:#2A0A45;
  --bad:#FF5A6E; --bad-deep:#A72639; --bad-soft:#3E1522;
  --locked:#33224B; --locked-deep:#24163A; --locked-ink:#7E6A9C;
  --leaf:#3DBB6F; --leaf-deep:#22804A; --soil:#6E4A30; --bud:#C9E57E;
  --outline:#B98AF0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#160A24; --surface:#22113A; --ink:#FFF5E6; --muted:#B8A5D2; --line:#3B2558;
  --primary:#8E44D1; --primary-deep:#4E1680; --on-primary:#FFF5E6;
  --go:#14A56F; --go-deep:#0A6845; --go-soft:#123A2C;
  --sun:#FFC100; --sun-deep:#B88800; --on-sun:#2A0A45;
  --bad:#FF5A6E; --bad-deep:#A72639; --bad-soft:#3E1522;
  --locked:#33224B; --locked-deep:#24163A; --locked-ink:#7E6A9C;
  --leaf:#3DBB6F; --leaf-deep:#22804A; --soil:#6E4A30; --bud:#C9E57E;
  --outline:#B98AF0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.app.full{padding-bottom:0}

/* Botones 3D */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;border-radius:16px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--primary);color:var(--on-primary);box-shadow:0 5px 0 var(--primary-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-deep)}
.btn.go{background:var(--go);box-shadow:0 5px 0 var(--go-deep);color:#fff}
.btn.go:active{box-shadow:0 1px 0 var(--go-deep)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep);color:#fff}
.btn.sun{background:var(--sun);color:var(--on-sun);box-shadow:0 5px 0 var(--sun-deep)}
.btn.ghost{background:var(--surface);color:var(--primary);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
:root[data-theme="dark"] .btn.ghost{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}}
.btn[disabled]{background:var(--locked);color:var(--locked-ink);box-shadow:0 5px 0 var(--locked-deep);cursor:not-allowed}
.btn[disabled]:active{transform:none}

/* Tarjeta con contorno de marca */
.card{background:var(--surface);border:2px solid var(--outline);border-radius:18px;box-shadow:0 6px 0 var(--outline);padding:16px}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px;border-bottom:2px solid var(--line);margin-bottom:8px}
.topbar .iso{width:30px;height:auto}
.stats{display:flex;gap:14px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.stat svg{width:24px;height:24px}
.stat.flame{color:#F28A00}.stat.heart{color:var(--bad)}.stat.xp{color:var(--sun-deep)}
.stat.cold{color:var(--locked-ink)}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-radius:12px;margin:4px}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="page"]{color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent);outline:2px solid color-mix(in srgb,var(--primary) 35%,transparent)}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{color:var(--ink)}}

/* Pantallas de entrada */
.gate{min-height:100%;display:flex;flex-direction:column;gap:20px;padding-block:28px 32px;justify-content:space-between}
.gate .logo{width:min(250px,70%);margin:0 auto;display:block}
.gate h1{font-size:clamp(30px,9vw,42px);color:var(--primary);text-align:center;letter-spacing:-.01em}
:root[data-theme="dark"] .gate h1{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gate h1{color:var(--ink)}}
.gate .kicker{font-weight:700;color:var(--muted);text-align:center}
.gate .hero{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:260px}
.gate .hero img.w{height:260px;width:auto;position:relative;z-index:2;animation:idle 3.2s ease-in-out infinite}
.gate .hero .sunburst{position:absolute;inset:auto 0 10px 0;margin:auto;width:280px;height:280px;z-index:1;color:var(--sun)}
.gate .actions{display:grid;gap:14px}
.fine{font-size:13px;color:var(--muted);text-align:center;max-width:42ch;margin:0 auto}
.minor{display:none;text-align:center;font-weight:700;color:var(--bad)}

.ob{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:20px 28px}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-top .bar{flex:1}
.tutor{display:flex;align-items:flex-end;gap:10px}
.tutor img{width:92px;height:auto;flex:none}
.tutor.big img{width:120px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-weight:600;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:22px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.choices{display:grid;gap:12px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:700;transition:transform .08s}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.choice .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.choice .ic svg{width:28px;height:28px}
.choice[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--surface));box-shadow:0 4px 0 var(--primary)}
.spacer{flex:1}

/* Camino */
.purpose{display:flex;gap:12px;align-items:center;margin-block:8px 18px}
.purpose img{width:58px;flex:none}
.purpose .t{font-size:13px;color:var(--muted);font-weight:600}
.purpose .t b{display:block;color:var(--ink);font-size:15px}
.goal{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.goal .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.goal .track{flex:1;height:14px;border-radius:99px;background:var(--locked);overflow:hidden}
.goal .fill{height:100%;background:var(--sun);border-radius:99px;transition:width .6s}
.goal .num{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

.unit{margin-bottom:30px}
.unit-head{position:relative;border-radius:18px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.unit-head .k{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.unit-head h2{font-size:19px;margin-top:4px}
.unit-head p{font-size:13px;opacity:.9;margin-top:4px}
.unit-head .chap{flex:none;font-family:var(--f-display);font-size:12px;border:2px solid currentColor;border-radius:10px;padding:6px 8px;text-align:center;line-height:1.2}
.u-green{background:var(--go)} .u-purple{background:var(--primary)} .u-sun{background:var(--sun);color:var(--on-sun)!important}
.u-locked{background:var(--locked);color:var(--locked-ink);box-shadow:0 5px 0 var(--locked-deep)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:40px;padding-block:44px 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{position:relative;width:76px;height:70px;border-radius:50%;display:grid;place-items:center;transition:transform .08s}
.node svg{width:34px;height:34px}
.node.done{background:var(--sun);color:var(--on-sun);box-shadow:0 7px 0 var(--sun-deep)}
.node.cur{background:var(--go);color:#fff;box-shadow:0 7px 0 var(--go-deep)}
.node.lock{background:var(--locked);color:var(--locked-ink);box-shadow:0 7px 0 var(--locked-deep);cursor:default}
.node:active:not(.lock){transform:translateY(5px);box-shadow:0 2px 0 var(--go-deep)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid color-mix(in srgb,var(--go) 35%,transparent);animation:ring 1.8s ease-out infinite}
.node .crown{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--sun);display:grid;place-items:center;border:2px solid var(--bg)}
.node .crown svg{width:14px;height:14px}
.tip{position:absolute;bottom:calc(100% + 12px);white-space:nowrap;background:var(--surface);border:2px solid var(--line);color:var(--go);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:12px;animation:bob 1.6s ease-in-out infinite;z-index:3}
.tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.node-label{margin-top:12px;font-size:13px;font-weight:700;color:var(--muted);max-width:140px;text-align:center}
.path-deco{position:absolute;width:118px;pointer-events:none;opacity:.98}
.soon{display:grid;gap:10px;margin-top:14px}
.soon-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--locked);color:var(--locked-ink);font-weight:700;font-size:14px}
.soon-item svg{width:22px;height:22px;flex:none}
.soon-item small{display:block;font-weight:600;font-size:12px;opacity:.85}

/* Lección */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson-in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.l-top{display:flex;align-items:center;gap:14px;padding-block:16px 8px}
.x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.x svg{width:26px;height:26px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--locked);overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.6,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.l-body{flex:1;overflow-y:auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:20px;min-height:0}
.l-body h2{font-size:21px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--primary)}
:root[data-theme="dark"] .eyebrow{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eyebrow{color:var(--sun)}}
.eyebrow.pro{color:var(--sun-deep)}
.quote{font-weight:700;color:var(--primary);border-left:4px solid var(--sun);padding-left:12px}
:root[data-theme="dark"] .quote{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .quote{color:var(--ink)}}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:600;font-size:16px}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 4px 0 var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.opt[aria-pressed="true"] .key{border-color:var(--primary);color:var(--primary)}
.opt.right{border-color:var(--go);box-shadow:0 4px 0 var(--go);background:var(--go-soft)}
.opt.wrong{border-color:var(--bad);box-shadow:0 4px 0 var(--bad);background:var(--bad-soft)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-weight:800;font-size:17px;padding-block:22px}
.statement{font-size:19px;font-weight:700;line-height:1.35}
.order-slot{min-height:64px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chip{padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:15px}
.chip.ghosted{visibility:hidden}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.l-foot{border-top:2px solid var(--line);padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);transition:background .2s}
.l-foot.good{background:var(--go-soft);border-color:transparent}
.l-foot.fail{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.fb img{width:64px;flex:none}
.fb h3{font-size:19px}
.fb.good h3{color:var(--go)} .fb.fail h3{color:var(--bad)}
.fb p{font-size:14px;margin-top:4px;font-weight:600}
.fb img.hop{animation:hop .5s}
.fb img.tilt{animation:tilt .6s}

/* Resultado */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:20px}
.result h2{font-size:26px;color:var(--sun-deep)}
.result .plant{width:190px;height:auto}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.tile{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.tile .h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:5px}
.tile .v{font-family:var(--f-display);font-size:20px;padding:12px 4px;font-variant-numeric:tabular-nums}
.pro-card{width:100%;text-align:left;border:2px solid var(--sun-deep);background:color-mix(in srgb,var(--sun) 14%,var(--surface));border-radius:18px;padding:16px;display:grid;gap:12px}
.pro-card .row{display:flex;gap:12px;align-items:center}
.pro-card .badge{flex:none;font-family:var(--f-display);font-size:12px;background:var(--primary);color:var(--sun);padding:6px 9px;border-radius:9px}

/* Mi cultivo */
.page-h{font-size:24px;margin-block:12px 6px}
.page-sub{color:var(--muted);font-weight:600;margin-bottom:18px}
.garden{display:grid;gap:18px}
.plant-card{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.plant-card svg{width:120px;height:auto}
.plant-card h3{font-size:18px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--locked);color:var(--locked-ink)}
.pill.go{background:var(--go-soft);color:var(--go)}
.pill.sun{background:var(--sun);color:var(--on-sun)}
.pill.purple{background:var(--primary);color:var(--on-primary)}
.big-num{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}
.ts{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.ts i{width:100%;height:10px;border-radius:99px;background:var(--locked)}
.ts.past i{background:var(--go)} .ts.now i{background:var(--sun)} .ts.now{color:var(--ink)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;width:100%}
.form{display:grid;gap:14px}
.notes{display:grid;gap:8px}
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:2px solid var(--line);font-size:14px}
.note time{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
.note p{overflow-wrap:anywhere}
.addnote{display:flex;gap:8px}
.addnote input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.addnote .btn{width:auto;min-height:46px;padding-inline:16px}
.reco{display:flex;gap:12px;align-items:center}
.reco img{width:56px;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linkish{color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px}

/* Logros y perfil */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.bdg .medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--primary);box-shadow:0 5px 0 var(--sun-deep)}
.bdg .medal svg{width:32px;height:32px}
.bdg b{font-size:13px;line-height:1.2}
.bdg small{font-size:11px;color:var(--muted);line-height:1.25}
.bdg.off .medal{background:var(--locked);color:var(--locked-ink);box-shadow:0 5px 0 var(--locked-deep)}
.bdg.off b{color:var(--locked-ink)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sg{display:flex;gap:10px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.sg svg{width:28px;height:28px;flex:none}
.sg .big-num{font-size:20px}
.sg small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.prof-head{display:flex;align-items:center;gap:14px;margin-block:14px 18px}
.prof-head img{width:74px}
.lvl{font-size:13px;font-weight:800;color:var(--muted)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:2px solid var(--line);font-weight:700}
.switch{width:52px;height:30px;border-radius:99px;background:var(--locked);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--go)}
.switch[aria-checked="true"]::after{left:25px}
.confirm{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--bad-soft);margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--primary);color:var(--on-primary);font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 5px 0 var(--primary-deep);max-width:calc(100% - 32px);text-align:center;animation:pop .3s}

@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.08)}100%{transform:translateY(0) scale(1)}}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(8deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:translateX(-50%) scale(.85);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes grow{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
.grow{animation:grow .9s cubic-bezier(.3,1.5,.6,1);transform-origin:50% 90%}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.tiles .tile .v{font-size:17px}}

/* ===== v2: navegación de 5 pestañas, cultivos, chat ===== */
.nav-in{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:10px;padding:9px 2px 7px;margin:4px 2px}
.nav button svg{width:26px;height:26px}
.nav .dot-badge{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.nav button{position:relative}

.vplant{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;margin-block:10px 16px;padding:10px 12px;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.vplant svg{width:84px;height:auto}
.vplant .t{font-size:13px;color:var(--muted);font-weight:600}
.vplant .t b{display:block;color:var(--ink);font-size:15px}
.vplant .goal{margin:8px 0 0}
.unit-actions{display:flex;justify-content:center;margin-top:-6px}
.test-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.test-btn svg{width:16px;height:16px}

/* Encabezados de sección */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-block:22px 10px}
.sec-h h2{font-size:16px}
.sec-h .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn.sm{width:auto;min-height:40px;padding:8px 14px;font-size:13px;border-radius:12px;box-shadow:0 4px 0 var(--go-deep)}
.btn.sm.ghost{box-shadow:0 4px 0 var(--line)}
.btn.sm svg{width:18px;height:18px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-width:130px}

/* Lista de cultivos */
.crops{display:grid;gap:14px}
.crop-card{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border:2px solid var(--outline);border-radius:18px;background:var(--surface);box-shadow:0 5px 0 var(--outline)}
.crop-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--outline)}
.crop-card svg.mini{width:64px;height:auto}
.crop-card h3{font-size:16px;overflow-wrap:anywhere}
.crop-card .meta{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.crop-card .day{text-align:right}
.crop-card .day .big-num{font-size:24px}
.crop-card .day small{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.crop-card.done{border-color:var(--line);box-shadow:0 5px 0 var(--line)}
.empty{display:grid;gap:14px;justify-items:center;text-align:center;padding:22px 16px;border:2px dashed var(--line);border-radius:18px}
.empty img{width:110px}
.empty p{max-width:36ch;color:var(--muted);font-weight:600}
.lote{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}

/* Detalle de cultivo */
.back-row{display:flex;align-items:center;gap:8px;margin-block:4px 6px}
.back-row button{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--muted);padding:6px 4px;font-size:14px}
.back-row button svg{width:22px;height:22px}
.crop-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.crop-head h1{font-size:22px;overflow-wrap:anywhere}
.crop-head .sub{color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:58px;font-size:10px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.02em}
.step i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--locked);color:var(--locked-ink);font-style:normal;font-size:12px}
.step i svg{width:16px;height:16px}
.step.past i{background:var(--go);color:#fff}
.step.now i{background:var(--sun);color:var(--on-sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 30%,transparent)}
.step.now{color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:2px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 4px 0 var(--line);font-size:11px;font-weight:800;text-align:center;line-height:1.15}
.qa:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.qa svg{width:26px;height:26px}
.c-clima{color:#E0602B}.c-riego{color:#2C7FD6}.c-tecnica{color:var(--go)}.c-plaga{color:var(--bad)}.c-nota{color:var(--primary)}
:root[data-theme="dark"] .c-nota{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-nota{color:var(--ink)}}
.qa span{color:var(--ink)}
.ranges{display:grid;gap:0}
.rg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.rg:last-child{border-bottom:0}
.rg b{font-size:14px}
.rg small{grid-column:1;font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.rg .pill{grid-row:1/span 2;grid-column:2;justify-self:end}
.pill.ok{background:var(--go-soft);color:var(--go)}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--locked);color:var(--locked-ink)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);min-width:0}
.chart h4{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart .nodata{font-size:12px;color:var(--muted);padding:22px 0;text-align:center}
.tasks{display:grid;gap:8px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--sun) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--sun) 45%,transparent);font-size:14px;font-weight:600}
.task svg{width:20px;height:20px;flex:none;color:var(--sun-deep);margin-top:1px}
.plan{display:grid;gap:0;position:relative}
.pl{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0}
.pl i{width:14px;height:14px;border-radius:50%;margin:3px 4px;background:var(--locked);display:block}
.pl.done i{background:var(--go)}
.pl.now i{background:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 30%,transparent)}
.pl b{font-size:14px;display:block}
.pl small{font-size:12px;color:var(--muted);font-weight:600}
.pl time{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.log-week{margin-top:14px}
.log-week h4{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.log{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:2px solid var(--line)}
.log .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg)}
.log .ic svg{width:18px;height:18px}
.log p{font-size:14px;overflow-wrap:anywhere}
.log p small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.log time{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.log .del{color:var(--muted);padding:2px}
.log .del svg{width:18px;height:18px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

/* Formularios en hoja completa */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chipsel button{padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"],.chipsel button[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface));color:var(--primary)}
:root[data-theme="dark"] .seg button[aria-pressed="true"],:root[data-theme="dark"] .chipsel button[aria-pressed="true"]{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"],:root:not([data-theme="light"]) .chipsel button[aria-pressed="true"]{color:var(--ink)}}
.chipsel{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:13px}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted);font-weight:600}
.field .unit{font-size:12px;color:var(--muted);font-weight:700}
.err{color:var(--bad);font-weight:700;font-size:14px}
.ficha{display:grid;gap:16px}
.ficha .card{display:grid;gap:10px}
.ficha h3{font-size:15px}
.copybox{width:100%;min-height:220px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px}

@media (max-width:380px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}.charts{grid-template-columns:1fr}}

.btn svg{width:20px;height:20px;flex:none}
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* ===== v3: Widcy animada, lecciones guiadas, actividades nuevas, selector unificado ===== */
.nav-in{grid-template-columns:repeat(4,1fr)}
.nav button{font-size:11px;padding:10px 4px 8px;margin:4px}
.nav button svg{width:28px;height:28px}

/* Widcy: poses y animaciones sutiles */
.wd-wrap{position:relative;display:grid;place-items:end center;flex:none}
.wd-wrap::before{content:"";position:absolute;left:50%;bottom:4%;width:88%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun) 34%,transparent) 0%,transparent 68%);z-index:0}
.wd{position:relative;z-index:1;display:block;height:auto;max-width:100%;transform-origin:50% 100%;animation:wd-pop .5s cubic-bezier(.3,1.6,.5,1) both,wd-idle 3.8s ease-in-out .5s infinite}
.wd.cheer{animation:wd-jump .7s cubic-bezier(.3,1.5,.5,1) both,wd-idle 3s ease-in-out .7s infinite}
.wd.sad{animation:wd-droop .9s ease-out both,wd-breathe 4s ease-in-out .9s infinite}
.wd.think{animation:wd-pop .45s cubic-bezier(.3,1.6,.5,1) both,wd-think 2.6s ease-in-out .45s infinite}
.wd.still{animation:wd-idle 4.2s ease-in-out infinite}
@keyframes wd-pop{0%{transform:scale(.6) translateY(14px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes wd-idle{0%,100%{transform:translateY(0) rotate(0) scaleY(1)}30%{transform:translateY(-4px) rotate(-1.4deg) scaleY(1.012)}65%{transform:translateY(-2px) rotate(1.2deg) scaleY(1.005)}}
@keyframes wd-jump{0%{transform:scale(.85) translateY(10px)}35%{transform:scale(1.04) translateY(-18px) rotate(-3deg)}60%{transform:scale(.98,1.03) translateY(0) rotate(2deg)}100%{transform:scale(1) translateY(0) rotate(0)}}
@keyframes wd-droop{0%{transform:translateY(-6px) rotate(0)}100%{transform:translateY(2px) rotate(-3deg)}}
@keyframes wd-breathe{0%,100%{transform:translateY(2px) rotate(-3deg) scaleY(1)}50%{transform:translateY(3px) rotate(-2.4deg) scaleY(.99)}}
@keyframes wd-think{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(-2deg) translateX(-2px)}75%{transform:rotate(2deg) translateX(2px)}}

/* Tarjeta de concepto (aprender) */
.learn{display:grid;gap:16px}
.learn-head{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);gap:12px;align-items:end}
.learn-head .wd-wrap{min-height:120px}
.say{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.say::before{content:"";position:absolute;left:-10px;bottom:24px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.say h2{font-size:18px;margin-bottom:6px}
.say p{font-size:15px;line-height:1.45}
.facts{display:grid;margin:0;padding:0;list-style:none}
.facts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
.facts li:last-child{border-bottom:0}
.facts li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--go);margin:6px 0 0 5px}
.facts.num{counter-reset:f}
.facts.num li::before{counter-increment:f;content:counter(f);width:22px;height:22px;margin:0;border-radius:50%;background:transparent;border:2px solid var(--go);color:var(--go);font-family:var(--f-display);font-size:11px;display:grid;place-items:center}
.facts b{color:var(--ink)}
.keyfact{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-left:4px solid var(--sun);background:color-mix(in srgb,var(--sun) 13%,transparent);border-radius:0 12px 12px 0;font-weight:700;font-size:15px}
.keyfact svg{width:20px;height:20px;flex:none;color:var(--sun-deep);margin-top:1px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.fig{margin:0;display:grid;gap:6px;justify-items:center;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.ill{display:block;width:100%;max-width:150px;aspect-ratio:1;background:#FFFDF8;border:1px solid #EADBC4;border-radius:14px}
.ill svg{width:100%;height:100%;display:block}
.q-ill{display:flex;justify-content:center}
.q-ill .ill{max-width:170px}

/* Tarjetas para descubrir */
.explore-hint{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--muted)}
.explore-hint .cnt{font-variant-numeric:tabular-nums;color:var(--primary)}
:root[data-theme="dark"] .explore-hint .cnt{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .explore-hint .cnt{color:var(--sun)}}
.xcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.xc{display:grid;gap:6px;align-content:start;text-align:left;padding:14px;border:2px solid var(--primary);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--primary);min-height:88px;transition:transform .08s}
.xc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary)}
.xc .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:15px}
.xc .t svg{width:22px;height:22px;flex:none;color:var(--primary)}
.xc .d{font-size:14px;line-height:1.4;color:var(--ink)}
.xc .tap{font-size:12px;font-weight:700;color:var(--muted)}
.xc[aria-expanded="true"]{border-color:var(--go);box-shadow:0 4px 0 var(--go);background:color-mix(in srgb,var(--go) 7%,var(--surface))}
.xc[aria-expanded="true"] .t svg{color:var(--go)}
:root[data-theme="dark"] .xc .t svg{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .xc .t svg{color:var(--sun)}}
.xc[aria-expanded="true"]{grid-column:1/-1}
@media (min-width:420px){.xc[aria-expanded="true"]{grid-column:auto}}

/* Pregunta con Widcy pensando */
.ask{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:end}
.ask .say{font-weight:700;font-size:16px}
.ask .say p{font-weight:700;font-size:16px}

/* Unir parejas: filas compartidas para que siempre queden alineadas */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);grid-auto-rows:1fr;gap:10px}
.mt{position:relative;display:flex;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:600;font-size:14px;text-align:left;line-height:1.25;min-height:58px;transition:background .15s,border-color .15s,opacity .2s}
.mt.sel{border-color:var(--primary);box-shadow:0 4px 0 var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.mt.ok{border-color:var(--go);box-shadow:0 4px 0 var(--go);background:var(--go-soft);color:var(--muted);opacity:.6}
.mt.no{border-color:var(--bad);box-shadow:0 4px 0 var(--bad);background:var(--bad-soft);animation:shake .4s}
.mt .mk{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.mt .mk svg{width:13px;height:13px}
.mt.ok .mk{background:var(--go)}
.mt.no .mk{background:var(--bad)}
.inline-msg{min-height:22px;text-align:center;font-weight:800;font-size:14px;color:var(--muted)}
.inline-msg.bad{color:var(--bad)}
.inline-msg.good{color:var(--go)}

/* Agrupar */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.bucket{display:grid;align-content:start;gap:8px;min-height:120px;padding:10px;border:2px dashed var(--outline);border-radius:16px;background:color-mix(in srgb,var(--primary) 5%,transparent);text-align:left;transition:background .15s,border-color .15s}
.bucket .bh{font-weight:800;font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px;line-height:1.2;overflow-wrap:anywhere}
.bucket .bh span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:20px;height:20px;border-radius:99px;background:var(--surface);display:inline-grid;place-items:center;padding:0 5px}
.bucket.armed{border-style:solid;background:color-mix(in srgb,var(--primary) 11%,transparent)}
.bucket.flash{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px}
.bucket .in .chip{box-shadow:none;border-color:var(--go);background:var(--go-soft);font-size:13px;padding:6px 9px;cursor:default}
.sort-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sort-bank .chip[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 4px 0 var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--surface))}
.sort-bank .chip.no{border-color:var(--bad);box-shadow:0 4px 0 var(--bad);background:var(--bad-soft);animation:shake .4s}
.chip .ill{width:64px;max-width:64px;margin:0 auto 4px}
.chip.has-ill{display:grid;justify-items:center;font-size:13px;padding:8px}

/* Elegir imagen */
.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pics.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pic{display:grid;gap:8px;justify-items:center;padding:10px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:13px}
.pic .ill{max-width:100%}
.pic .lbl{min-height:18px;color:var(--muted);text-align:center;line-height:1.2}
.pic[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 4px 0 var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.pic.right{border-color:var(--go);box-shadow:0 4px 0 var(--go);background:var(--go-soft)}
.pic.wrong{border-color:var(--bad);box-shadow:0 4px 0 var(--bad);background:var(--bad-soft)}
.pic.right .lbl,.pic.wrong .lbl{color:var(--ink)}

/* Deslizador */
.slider{display:grid;gap:14px;padding:18px 14px;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.slider .val{text-align:center;font-family:var(--f-display);font-size:40px;font-variant-numeric:tabular-nums;color:var(--primary);line-height:1}
:root[data-theme="dark"] .slider .val{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .slider .val{color:var(--sun)}}
.slider .trk{position:relative;height:44px}
.slider .band{position:absolute;top:15px;height:14px;border-radius:99px;background:var(--go);opacity:0;transition:opacity .3s}
.slider.done .band{opacity:.9}
.slider input[type=range]{position:absolute;inset:0;width:100%;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.slider input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:99px;background:var(--locked)}
.slider input[type=range]::-moz-range-track{height:14px;border-radius:99px;background:var(--locked)}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-10px;border-radius:50%;background:var(--sun);border:3px solid var(--primary);box-shadow:0 3px 0 var(--primary)}
.slider input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--sun);border:3px solid var(--primary)}
.slider.done input[type=range]::-webkit-slider-runnable-track{background:transparent}
.slider.done input[type=range]::-moz-range-track{background:transparent}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.slider .trk::before{content:"";position:absolute;left:0;right:0;top:15px;height:14px;border-radius:99px;background:var(--locked);z-index:0}
.slider input[type=range]{z-index:2}
.slider .band{z-index:1}

/* Completar la frase */
.sentence{font-size:20px;font-weight:700;line-height:1.6}
.blank{display:inline-block;min-width:110px;padding:0 10px;border-bottom:3px solid var(--primary);text-align:center;color:var(--primary)}
:root[data-theme="dark"] .blank{color:var(--sun);border-color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blank{color:var(--sun);border-color:var(--sun)}}
.blank.right{border-color:var(--go);color:var(--go)}
.blank.wrong{border-color:var(--bad);color:var(--bad)}
.fill-opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fill-opts .chip[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 4px 0 var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--surface))}

/* Retroalimentación */
.fb .wd-wrap{width:74px}
.fb .wd-wrap::before{display:none}
.fb .wd{width:74px}

/* Modal de salida y modales en general */
.modal{position:fixed;inset:0;z-index:95;display:grid;align-items:end;background:rgba(20,6,34,.55);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal-card{max-width:520px;width:100%;margin:0 auto calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:2px solid var(--outline);border-radius:22px;box-shadow:0 6px 0 var(--outline);padding:18px 18px 20px;display:grid;gap:14px;animation:sheet-up .25s ease-out}
.modal-card h2{font-size:20px}
.modal-card p{color:var(--muted);font-weight:600}
.modal-card .row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.modal-card .row .wd-wrap::before{display:none}
.modal-card .hearts{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-weight:800}
.modal-card .hearts svg{width:20px;height:20px}
@keyframes sheet-up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

/* Selector unificado */
.select{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;font-weight:700;color:var(--ink);text-align:left}
.select svg{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .2s}
.select[aria-expanded="true"] svg{transform:rotate(180deg)}
.setting .select{width:auto;min-width:150px;min-height:44px}
.opts-list{display:grid;gap:8px;max-height:60vh;overflow-y:auto;padding:2px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700;text-align:left}
.opt-row small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.opt-row .rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt-row[aria-selected="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.opt-row[aria-selected="true"] .rd{border-color:var(--primary);background:var(--primary)}
.opt-row[aria-selected="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}

/* Formularios en hoja: aire a los lados y foco que no se recorta */
.sheet-body{padding-inline:6px;padding-block:14px 28px;align-content:start}
.sheet-body .field label{padding-left:2px}
.field input,.field select,.field textarea,.select{min-height:50px}
.field input:focus-visible,.field textarea:focus-visible,.select:focus-visible{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
.seg.even{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.seg.even button{text-align:center;line-height:1.2;min-height:46px}
.seg button,.chipsel button{min-height:44px}
.sheet-panel{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--go) 9%,var(--surface));border:2px solid color-mix(in srgb,var(--go) 30%,transparent)}
.sheet-panel b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--go)}
.sheet-panel .rg{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--go) 22%,transparent)}
.sheet-panel .rg:last-child{border-bottom:0}
.sheet-panel .rg small{font-size:14px;font-weight:700;color:var(--ink);text-align:right}

/* Registro por categorías con su rango ideal */
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line)}
.cat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cat .ci{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.cat .ci svg{width:24px;height:24px}
.cat b{font-size:15px;display:block}
.cat small{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.35;font-variant-numeric:tabular-nums}
.cat .add{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--go);color:#fff;box-shadow:0 3px 0 var(--go-deep)}
.cat .add svg{width:20px;height:20px}
.cat .pill{margin-top:4px;display:inline-block}

/* Paginación de la bitácora */
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.pager span{flex:1;text-align:center;white-space:nowrap;font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.pager .btn{width:auto;min-height:40px;padding:8px 12px;font-size:12px}
.pager .btn[disabled]{visibility:hidden}

@media (prefers-reduced-motion: reduce){.wd,.wd.cheer,.wd.sad,.wd.think,.wd.still{animation:none!important}}
.log-wk{margin:14px 0 2px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.log-wk:first-child{margin-top:8px}
.reco .wd-wrap::before,.prof-head .wd-wrap::before{display:none}
.empty .wd-wrap{margin:0 auto}
.path-deco .wd-wrap::before{display:none}
.result .wd-wrap{margin:0 auto}

</style>
</head>

    return s;
  }

   Regla de diseño: cada lección primero explica (learn / explore) y luego
   practica SOLO lo que ya se explicó en esa lección o en las anteriores.

   learn(título, texto, {points:[[término,texto]], num:true, key:'dato clave', pose, imgs:[[ilustración,etiqueta]]})

   mc(pregunta, [opciones], índiceCorrecto, explicación, {img})
   tf(afirmación, true|false, explicación)
   match(pregunta, [[izquierda, derecha], ...])
   order(pregunta, [elementos en el orden correcto], explicación)

const KEY='roxs-cultiva-v1', KEY_C='roxs-cultiva-crops-v2';
const fresh = () => ({age:false, onboarded:false, purpose:null, exp:0, goal:30, xp:0, daily:{d:'',xp:0}, streak:0, lastDay:null, hearts:5, heartsTs:Date.now(), done:{}, proWins:0, badges:[], plant:null, notes:[], sound:true, tab:'learn', asked:0, examPassed:0, trackDay:'', deletedCrops:[], updatedAt:0});
let S = fresh(), CROPS = [];

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(){

function cropFromV1(p, notes){
  const st = p.stage==='germinacion'?'germinacion':p.stage==='plantula'?'plantula':p.stage==='vegetativa'?'vegetativa':p.stage==='floracion'?'floracion':'maduracion';
  const c = newCrop({name:p.name, start:p.start, stage:st});

/* Sincronización con la cuenta (capability db, privada por persona) */
const Cloud = {on:false, failed:false, db:null, uid:null, q:{}, busy:{}, timers:{}};
const cdoc = id => Cloud.db.collection('data/users/'+Cloud.uid).doc(id);
function cloudWrite(id, data){
  if(!Cloud.on || Cloud.failed) return;
  clearTimeout(Cloud.timers[id]);
  Cloud.timers[id] = setTimeout(()=>{ Cloud.q[id] = data===null ? {__del:true} : clone(data); if(!Cloud.busy[id]) cloudFlush(id); }, 700);
}
async function cloudFlush(id){
  Cloud.busy[id]=true;
  while(Cloud.q[id]!==undefined){
    const d=Cloud.q[id]; delete Cloud.q[id];
    const run = () => d.__del ? cdoc(id).delete() : cdoc(id).set(d);
    try{ await run(); }
    catch(e){
      const code=e&&e.code;
      if(code==='unavailable'){ await sleep(700+Math.random()*900); try{ await run(); }catch(e2){} }
      else if(code==='quota_exceeded'){ toast('Tu espacio de datos está lleno. Borra cultivos antiguos para seguir guardando en tu cuenta.'); }
      else { Cloud.failed=true; break; }
    }
  }
  Cloud.busy[id]=false;
}
function saveS(){ S.updatedAt=Date.now(); lsSet(KEY,S); cloudWrite('progress',{S}); }
function saveCrop(c){ c.updatedAt=Date.now(); lsSet(KEY_C,CROPS); cloudWrite('crop-'+c.id, c); }
async function cloudInit(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  try{
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    Cloud.db=db; Cloud.uid=id;
    const snap = await Promise.race([db.collection('data/users/'+id).get(), sleep(10000).then(()=>null)]);
    if(!snap) return;
    let rp=null; const rc={};
    snap.docs.forEach(d=>{ if(!d.exists) return; const v=d.data(); if(d.id==='progress') rp=v; else if(d.id.startsWith('crop-') && v && v.id) rc[v.id]=v; });
    Cloud.on=true;
    if(rp && rp.S && (rp.S.updatedAt||0) > (S.updatedAt||0)){ const keepTab=S.tab; S=Object.assign(fresh(), clone(rp.S)); S.tab=keepTab; lsSet(KEY,S); }
    else if(S.updatedAt) cloudWrite('progress',{S});
    const del = new Set(S.deletedCrops||[]);
    const local = Object.fromEntries(CROPS.map(c=>[c.id,c]));
    const ids = new Set([...Object.keys(local), ...Object.keys(rc)]);
    const merged=[];
    ids.forEach(cid=>{
      if(del.has(cid)){ if(rc[cid]) cloudWrite('crop-'+cid, null); return; }
      const a=local[cid], b=rc[cid];
      if(a && b){ if((b.updatedAt||0) > (a.updatedAt||0)) merged.push(clone(b)); else { merged.push(a); if((a.updatedAt||0)>(b.updatedAt||0)) cloudWrite('crop-'+cid,a); } }
      else if(b) merged.push(clone(b));
      else { merged.push(a); cloudWrite('crop-'+cid,a); }
    });
    CROPS = merged.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
    lsSet(KEY_C, CROPS);
    if(!L && !UI.view) render();
  }catch(e){ Cloud.on=false; }
}

function refillHearts(){ const step=20*60*1000; if(S.hearts>=5){ S.heartsTs=Date.now(); return; } const n=Math.floor((Date.now()-S.heartsTs)/step); if(n>0){ S.hearts=Math.min(5,S.hearts+n); S.heartsTs+=n*step; } }
function dailyXP(){ return S.daily.d===today()?S.daily.xp:0; }
function streakAlive(){ return !!S.lastDay && daysBetween(S.lastDay,today())<=1; }
function curStreak(){ return streakAlive()?S.streak:0; }
function level(){ const i=Math.min(LEVELS.length-1, Math.floor(S.xp/LVL_XP)); return {i, name:LEVELS[i], next:(i+1)*LVL_XP}; }
function doneCount(){ return ALL_LESSONS.filter(l=>S.done[l.id]).length; }
function plantStage(){ const f=doneCount()/ALL_LESSONS.length; return f===0?0:f<0.15?1:f<0.35?2:f<0.6?3:f<1?4:5; }
function plantThirsty(){ return !!S.lastDay && daysBetween(S.lastDay,today())>=2; }
function isUnlocked(id){ const i=ALL_LESSONS.findIndex(l=>l.id===id); return i===0 || !!S.done[ALL_LESSONS[i-1].id] || !!S.done[id]; }
function currentLesson(){ return ALL_LESSONS.find(l=>!S.done[l.id] && isUnlocked(l.id)) || ALL_LESSONS.find(l=>!S.done[l.id]); }
function totalLogs(){ return CROPS.reduce((n,c)=>n+c.logs.filter(l=>l.t!=='etapa').length,0); }
function award(id){ if(!S.badges.includes(id)){ S.badges.push(id); return BADGES.find(b=>b.id===id); } return null; }
function checkBadges(){
  const got=[], push=b=>b&&got.push(b), n=doneCount();
  if(n>=1) push(award('first'));
  if(Object.values(S.done).some(d=>d.perfect)) push(award('perfect'));
  if(curStreak()>=3) push(award('streak3'));
  if(curStreak()>=7) push(award('streak7'));
  if(S.examPassed>0) push(award('exam'));
  if(n>=Math.ceil(ALL_LESSONS.length/2)) push(award('half'));
  if(n===ALL_LESSONS.length) push(award('master'));
  if(S.proWins>=10) push(award('pro10'));
  if(CROPS.length) push(award('grower'));
  if(totalLogs()>=10) push(award('logger'));
  if(CROPS.some(c=>c.harvest&&c.harvest.cata)) push(award('harvest'));
  if(new Set(CROPS.flatMap(c=>c.logs.filter(l=>l.t!=='etapa').map(l=>l.d))).size>=7) push(award('weeklog'));
  return got;
}
function addXP(n){
  S.xp+=n; const t=today();
  if(S.daily.d!==t) S.daily={d:t,xp:0};
  S.daily.xp+=n;
  if(S.lastDay!==t){ S.streak = (S.lastDay && daysBetween(S.lastDay,t)===1) ? S.streak+1 : 1; S.lastDay=t; }
}

let AC=null;
function tone(seq){ if(!S.sound) return; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime; seq.forEach(([f,d,type])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }
const SFX = { ok:()=>tone([[660,.12],[990,.2]]), bad:()=>tone([[220,.18,'square'],[180,.22,'square']]), win:()=>tone([[523,.14],[659,.14],[784,.14],[1047,.3]]) };

/* ---------- Planta virtual (SVG) ---------- */
function leafPath(n,len,wid){
  const spreads = n===1?[0]:n===3?[-38,0,38]:n===5?[-70,-35,0,35,70]:[-85,-58,-28,0,28,58,85];
  const scale = n===1?[1]:n===3?[.75,1,.75]:n===5?[.5,.8,1,.8,.5]:[.35,.55,.82,1,.82,.55,.35];
  return spreads.map((a,i)=>{ const L=len*scale[i], W=wid*scale[i]; return `<path transform="rotate(${a})" d="M0 0 C ${W} ${-L*.3}, ${W*.7} ${-L*.75}, 0 ${-L} C ${-W*.7} ${-L*.75}, ${-W} ${-L*.3}, 0 0Z"/>`; }).join('');
}
function fan(x,y,ang,n,len,wilt){ const a=ang+(wilt?(ang<0?-25:25):0); return `<g transform="translate(${x} ${y}) rotate(${a})" fill="var(--leaf)" stroke="var(--leaf-deep)" stroke-width="1.2">${leafPath(n,len,len*.2)}</g>`; }
function bud(x,y,r){ let s=''; for(let i=0;i<6;i++){ const a=i*60*Math.PI/180; s+=`<circle cx="${x+Math.cos(a)*r*.45}" cy="${y+Math.sin(a)*r*.55}" r="${r*.55}"/>`; } return `<g fill="var(--bud)" stroke="var(--leaf-deep)" stroke-width="1">${s}<circle cx="${x}" cy="${y-r*.3}" r="${r*.6}"/></g><g fill="#fff" opacity=".9">${[0,1,2,3].map(i=>`<circle cx="${x-r*.5+i*r*.33}" cy="${y-r*.2+(i%2)*r*.4}" r="1.3"/>`).join('')}</g>`; }
function plantSVG(stage, thirsty, cls){
  const W=200,H=230, base=168;
  const pot = `<g><path d="M48 168 h104 l-12 56 h-80z" fill="var(--primary)"/><rect x="42" y="160" width="116" height="16" rx="5" fill="var(--primary)"/><g fill="var(--sun)"><rect x="56" y="186" width="88" height="5" rx="2"/><rect x="58" y="197" width="84" height="4" rx="2"/><rect x="60" y="207" width="80" height="3" rx="1.5"/></g><ellipse cx="100" cy="163" rx="52" ry="6" fill="var(--soil)"/></g>`;
  let p=''; const wilt=!!thirsty;
  if(stage===0){ p=`<ellipse cx="100" cy="160" rx="9" ry="6" fill="#8A5A34" stroke="#5B3A24" stroke-width="1.5"/><path d="M95 158 q5 -4 10 0" stroke="#C59A6A" stroke-width="1.5" fill="none"/>`; }
  else {
    const h=[0,26,52,96,118,124][stage], top=base-h, sway=wilt?14:0;
    p+=`<path d="M100 ${base} C 98 ${base-h*.4}, ${102+sway} ${base-h*.7}, ${100+sway} ${top}" stroke="var(--leaf-deep)" stroke-width="${stage>2?5:3.5}" fill="none" stroke-linecap="round"/>`;
    if(stage===1){ p+=`<g fill="var(--leaf)" stroke="var(--leaf-deep)" stroke-width="1.2"><ellipse cx="88" cy="${top+2}" rx="11" ry="6" transform="rotate(-20 88 ${top+2})"/><ellipse cx="112" cy="${top+2}" rx="11" ry="6" transform="rotate(20 112 ${top+2})"/></g>`; }
    else {
      const nodes = stage===2?1:stage===3?3:4;
      for(let i=0;i<nodes;i++){
        const y = base - 22 - i*(h-30)/Math.max(1,nodes), x = 100 + sway*((base-y)/h);
        const len = stage===2?24:44 - i*6, n = stage===2?3:(i===nodes-1?5:7);
        p+=fan(x-2,y,-62,n,len,wilt)+fan(x+2,y,62,n,len,wilt);
        if(stage>=4 && i>0) p+=bud(x-26,y-10,stage===5?7:5)+bud(x+26,y-10,stage===5?7:5);
      }
      const tx=100+sway;
      if(stage===2) p+=fan(tx,top+2,0,3,16,false);
      else if(stage===3) p+=fan(tx,top+4,0,5,26,wilt);
      else p+=bud(tx,top,stage===5?13:10)+fan(tx-4,top+18,-40,5,20,wilt)+fan(tx+4,top+18,40,5,20,wilt);
    }
  }
  const glow = stage===5?`<g fill="var(--sun)">${[[40,40],[160,52],[150,110],[46,104]].map(([x,y])=>`<path transform="translate(${x} ${y}) scale(.5)" d="M12 2c.8 5.2 4.8 9.2 10 10-5.2.8-9.2 4.8-10 10-.8-5.2-4.8-9.2-10-10 5.2-.8 9.2-4.8 10-10z"/>`).join('')}</g>`:'';
  const drops = wilt?`<g fill="var(--muted)" opacity=".7"><path d="M150 40c0 0-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></g>`:'';
  return `<svg ${cls?`class="${cls}"`:''} viewBox="0 0 ${W} ${H}" role="img" aria-label="Planta: ${['semilla','germinación','plántula','vegetativa','floración','lista para cosecha'][stage]}${wilt?', sedienta':''}">${glow}${drops}<g${wilt?' opacity=".85"':''}>${p}</g>${pot}</svg>`;
}
const cropPlantStage = c => { const i=STG.findIndex(s=>s.id===c.stage); return i<=0?1:i===1?2:i===2?3:i<=4?4:5; };

/* ---------- Modales y selector unificado ---------- */
function modal(inner, onAction, onClose){
  closeModal();
  const m=document.createElement('div'); m.className='modal'; m.id='modal';
  m.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(m);
  const done=(v)=>{ closeModal(); onClose&&onClose(v); };
  m.addEventListener('click',e=>{ if(e.target===m) return done(null); const b=e.target.closest('[data-m]'); if(b){ const v=b.dataset.m; closeModal(); onAction&&onAction(v, b); } });
  m.querySelector('[data-m]')?.focus();
  return m;
}
function closeModal(){ document.getElementById('modal')?.remove(); document.querySelectorAll('.select[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false')); }
const selH = (id, opts, value, title) => { const cur=opts.find(o=>o[0]===value)||opts[0];
  return `<button type="button" class="select" id="${id}" data-val="${esc(cur[0])}" data-title="${esc(title)}" data-opts="${esc(JSON.stringify(opts))}" aria-haspopup="listbox" aria-expanded="false"><span>${esc(cur[1])}</span>${I.chev}</button>`; };
const selV = id => document.getElementById(id)?.dataset.val || '';
function wireSelects(root=document){
  root.querySelectorAll('.select').forEach(btn=>btn.onclick=()=>{
    const opts=JSON.parse(btn.dataset.opts); btn.setAttribute('aria-expanded','true');
    modal(`<h2>${esc(btn.dataset.title)}</h2><div class="opts-list" role="listbox">${opts.map(([v,l,sub])=>`<button class="opt-row" role="option" data-m="${esc(v)}" aria-selected="${v===btn.dataset.val}"><span>${esc(l)}${sub?`<small>${esc(sub)}</small>`:''}</span><span class="rd"></span></button>`).join('')}</div>`,
      v=>{ const o=opts.find(x=>x[0]===v); if(!o) return; btn.dataset.val=v; btn.querySelector('span').textContent=o[1]; btn.setAttribute('aria-expanded','false'); btn.dispatchEvent(new Event('change')); btn.focus(); },
      ()=>btn.setAttribute('aria-expanded','false'));
  });
}
