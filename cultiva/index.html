  $app.innerHTML=`<section class="ob">${head}${body}<div class="spacer"></div>${foot}</section>`;
  document.getElementById('ob-back')?.addEventListener('click',()=>renderOnboarding(step-1));
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ S.purpose=b.dataset.p; saveS(); renderOnboarding(1); });
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ S.exp=+b.dataset.e; saveS(); renderOnboarding(2); });
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ S.goal=+b.dataset.g; saveS(); renderOnboarding(3); });
  const nx=document.getElementById('ob-next');
  nx && (nx.onclick=()=>{ if(step<3) return renderOnboarding(step+1); S.onboarded=true; S.tab='learn'; saveS(); render(); });
  document.getElementById('ob-test')?.addEventListener('click',()=>{ S.onboarded=true; saveS(); startLesson({id:'placement', title:'Prueba de nivel', steps:PLACEMENT}, {exam:'placement'}); });
}

/* ---------- Aprender ---------- */
function renderLearn(){
  const p = PURPOSES[S.purpose] || PURPOSES.terapeutico;
  const dx = dailyXP(), pct=Math.min(100, dx/S.goal*100);
  const cur = currentLesson(), vs=plantStage(), th=plantThirsty();
  const offs=[0,62,92,62,0,-62,-92,-62]; let k=0;
  const vNames=['Semilla','Germinación','Plántula','Vegetativa','Floración','Lista para cosecha'];
  const units = UNITS.map((u,ui)=>{
    const unlocked = isUnlocked(u.lessons[0].id), complete=u.lessons.every(l=>S.done[l.id]);
    const nodes = u.lessons.map(l=>{
      const done=!!S.done[l.id], isCur=cur&&cur.id===l.id, open=isUnlocked(l.id);
      const cls = done?'done':isCur?'cur':'lock', off = offs[k++ % offs.length];
      return `<div class="node-wrap" style="transform:translateX(${off}px)">${isCur?`<span class="tip">Empezar</span>`:''}
        <button class="node ${cls}" data-lesson="${l.id}" ${open?'':'aria-disabled="true"'} aria-label="${esc(l.title)}${done?' (completada)':open?'':' (bloqueada)'}">${done?I.check:open?(I[l.icon]||I.leaf):I.lock}${S.done[l.id]?.pro?`<span class="crown">${I.star}</span>`:''}</button>
        <span class="node-label">${esc(l.title)}</span></div>`;
    }).join('');
    const side = ui%2===0 ? 'left:-4px' : 'right:-4px';
    const deco = `<span class="path-deco" style="${side};top:${u.lessons.length>2?70:40}px;width:${u.pose==='saludando'||u.pose==='triste'?78:104}px">${wd(u.pose,'still')}</span>`;
    const test = !complete && ui>0 && !unlocked ? `<div class="unit-actions"><button class="test-btn" data-test="${u.id}">${I.bolt}Saltar con examen</button></div>`:'';
    return `<section class="unit" id="unit-${u.id}"><div class="unit-head ${unlocked?u.cls:'u-locked'}"><div><div class="k">Unidad ${ui+1}</div><h2>${u.title}</h2><p>${u.sub}</p></div><span class="chap">${u.chap}</span></div>${test}<div class="path">${deco}${nodes}</div></section>`;
  }).join('');
  $app.innerHTML = topbar() + `
    <div class="vplant">${plantSVG(vs,th)}<div class="t"><b>${th?'Tu planta tiene sed':vNames[vs]}</b>Enfoque ${p.name.toLowerCase()} · ${doneCount()}/${ALL_LESSONS.length} lecciones
      <div class="goal"><span class="lbl">Hoy</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="num">${dx}/${S.goal} XP</span></div></div></div>
    ${units}`;
  document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.lesson;
    if(!isUnlocked(id)) return toast('Completa la lección anterior o salta la unidad con un examen');
    const l=lessonById(id);
    if(S.done[id]) return startLesson(l,{practice:true});
    if(S.hearts<=0) return noHearts();
    startLesson(l,{});
  });
  document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{
    const u=UNITS.find(x=>x.id===b.dataset.test);
    const pool=shuffle(u.lessons.flatMap(l=>l.steps.filter(isActivity))).slice(0,6).map(s=>({...s,_order:undefined,_r:undefined,_l:undefined,_b:undefined}));
    startLesson({id:'test-'+u.id, title:'Examen: '+u.title, steps:pool, unitPose:u.pose}, {exam:'unit', unit:u.id});
  });
  if(cur){ const el=document.querySelector(`[data-lesson="${cur.id}"]`); if(el && doneCount()>0) setTimeout(()=>el.scrollIntoView({block:'center'}),50); }
}
function noHearts(){
  const done = ALL_LESSONS.filter(l=>S.done[l.id]);
  const mins = Math.max(1,Math.ceil((20*60*1000-(Date.now()-S.heartsTs))/60000));
  UI.view='hearts';
  $layer.innerHTML=`<div class="lesson"><div class="lesson-in"><div class="result">${wd('triste','sad',150)}<h2 style="color:var(--bad)">Te quedaste sin vidas</h2>
    <p style="max-width:34ch">Recuperas una vida cada 20 minutos (la próxima en ${mins} min). Repasar una lección completada no gasta vidas y te devuelve una.</p></div>
    <div class="l-foot" style="display:grid;gap:14px">${done.length?`<button class="btn go" id="nh-p">Repasar y recuperar una vida</button>`:''}<button class="btn ghost" id="nh-x">Volver</button></div></div></div>`;
  document.getElementById('nh-x').onclick=()=>{ $layer.innerHTML=''; UI.view=null; };
  document.getElementById('nh-p')?.addEventListener('click',()=>startLesson(done[Math.floor(Math.random()*done.length)],{practice:true, refill:true}));
}

/* ---------- Motor de lecciones ---------- */
let L=null;
function startLesson(lesson, opts){ L = { lesson, opts, queue: lesson.steps.map(s=>({...s})), idx:0, mistakes:0, answered:0, firstTry:0, retried:new Set(), phase:'main', learnN:0 }; UI.view='lesson'; drawStep(); }
const noHeartsMode = () => L.opts.practice || L.opts.exam;
function teachPose(s){
  if(s.pose) return s.pose;
  const up=L.lesson.unitPose; L.learnN++;
  return (up && ['lupa','regando','saludando'].includes(up) && L.learnN%2===0) ? up : 'explicando';
}
const askH = (q, extra='') => `<div class="ask">${wd('pensando','think')}<div class="say"><p>${q}</p></div></div>${extra}`;
function drawStep(){
  const s = L.queue[L.idx];
  const prog = L.phase==='pro' ? 100 : Math.min(100, L.idx / L.queue.length * 100);
  L.state = {sel:null, matched:[], left:null, picked:[], err:false, seen:new Set(), placed:0, moved:false};
  const isPro = L.phase==='pro';
  const eyebrow = isPro?'<span class="eyebrow pro">Reto Pro · +10 XP</span>': L.retried.has(L.idx)?'<span class="eyebrow">Repasemos este</span>': L.opts.exam?`<span class="eyebrow">${L.opts.exam==='unit'?'Examen de unidad':'Prueba de nivel'} · ${L.idx+1}/${L.queue.length}</span>`:'';
  let html='', needs=true, btn='Comprobar';
  if(s.t==='learn'){
    needs=false; btn='Continuar';
    html=`<div class="learn"><span class="eyebrow ${s.pro?'pro':''}">${s.pro?'Dato Pro':'Aprende'}</span>
      <div class="learn-head">${wd(teachPose(s))}<div class="say"><h2>${s.title}</h2><p>${s.body}</p></div></div>
      ${s.imgs?`<div class="figs">${s.imgs.map(([k,l])=>`<figure class="fig">${ILL(k)}<figcaption>${l}</figcaption></figure>`).join('')}</div>`:''}
      ${s.points?`<ul class="facts ${s.num?'num':''}">${s.points.map(([b,d])=>`<li><span><b>${b}.</b> ${d}</span></li>`).join('')}</ul>`:''}
      ${s.key?`<p class="keyfact">${I.spark}<span>${s.key}</span></p>`:''}</div>`;
  } else if(s.t==='explore'){
    btn='Continuar';
    html=`<div class="learn"><span class="eyebrow">Descubre</span><div class="learn-head">${wd(teachPose(s))}<div class="say"><h2>${s.title}</h2><p>${s.intro}</p></div></div>
      <div class="explore-hint"><span>Toca cada tarjeta para descubrirla</span><span class="cnt" id="xcnt">0/${s.cards.length}</span></div>
      <div class="xcards">${s.cards.map(([t,d,ic],i)=>`<button class="xc" data-x="${i}" aria-expanded="false"><span class="t">${t}${I[ic]||I.plus}</span><span class="d" hidden>${d}</span><span class="tap">Toca para ver</span></button>`).join('')}</div></div>`;
  } else if(s.t==='mc'){
    const order = s._order || (s._order = shuffle(s.o.map((_,i)=>i)));
    html=`${eyebrow}${askH(s.q, s.img?`<div class="q-ill">${ILL(s.img)}</div>`:'')}<div class="opts">${order.map((oi,n)=>`<button class="opt" data-o="${oi}" aria-pressed="false"><span class="key">${n+1}</span><span>${s.o[oi]}</span></button>`).join('')}</div>`;
  } else if(s.t==='tf'){
    html=`${eyebrow}<span class="eyebrow">¿Verdadero o falso?</span>${askH(s.q)}<div class="tf"><button class="opt" data-o="1" aria-pressed="false">Verdadero</button><button class="opt" data-o="0" aria-pressed="false">Falso</button></div>`;
  } else if(s.t==='fill'){
    const order = s._order || (s._order = shuffle(s.o.map((_,i)=>i)));
    const [a,b] = s.q.split('___');
    html=`${eyebrow}${askH('Completa la frase.')}<p class="sentence">${a}<span class="blank" id="blank">&nbsp;</span>${b||''}</p><div class="fill-opts">${order.map(oi=>`<button class="chip" data-o="${oi}" aria-pressed="false">${s.o[oi]}</button>`).join('')}</div>`;
  } else if(s.t==='pic'){
    const order = s._order || (s._order = shuffle(s.o.map((_,i)=>i)));
    html=`${eyebrow}${askH(s.q)}<div class="pics ${s.o.length===3?'three':''}">${order.map((oi,n)=>`<button class="pic" data-o="${oi}" aria-pressed="false" aria-label="Opción ${'ABCD'[n]}">${ILL(s.o[oi][0])}<span class="lbl">${'ABCD'[n]}</span></button>`).join('')}</div>`;
  } else if(s.t==='slider'){
    const st=s.step||1, fmt=v=>(st<1?(+v).toFixed(1):Math.round(v))+(s.unit||'');
    const lo=(s.range[0]-s.min)/(s.max-s.min)*100, wdt=Math.max((s.range[1]-s.range[0])/(s.max-s.min)*100,2);
    html=`${eyebrow}${askH(s.q)}<div class="slider" id="sld"><div class="val" id="sval" aria-live="polite">${fmt(s.start)}</div>
      <div class="trk"><span class="band" style="left:${lo}%;width:${wdt}%"></span><input type="range" id="srange" min="${s.min}" max="${s.max}" step="${st}" value="${s.start}" aria-label="${esc(s.q)}"></div>
      <div class="ends"><span>${fmt(s.min)}</span><span>${fmt(s.max)}</span></div></div><p class="hint" style="text-align:center">Mueve el control y luego comprueba.</p>`;
  } else if(s.t==='match'){
    needs=false;
    const R = s._r || (s._r = shuffle(s.pairs.map((_,i)=>i))), Lf = s._l || (s._l = shuffle(s.pairs.map((_,i)=>i)));
    html=`${eyebrow}<h2>${s.q}</h2><div class="match">${Lf.map((li,i)=>`<button class="mt" data-l="${li}">${s.pairs[li][0]}</button><button class="mt" data-r="${R[i]}">${s.pairs[R[i]][1]}</button>`).join('')}</div><p class="inline-msg" id="imsg" aria-live="polite">Toca uno de la izquierda y su pareja a la derecha.</p>`;
  } else if(s.t==='sort'){
    needs=false;
    const B = s._b || (s._b = shuffle(s.items.map((_,i)=>i)));
    html=`${eyebrow}<h2>${s.q}</h2><div class="buckets">${s.groups.map((g,gi)=>`<button class="bucket" data-g="${gi}"><span class="bh">${g}<span id="bc-${gi}">0</span></span><span class="in" id="bin-${gi}"></span></button>`).join('')}</div>
      <p class="inline-msg" id="imsg" aria-live="polite">Toca una tarjeta y luego el grupo donde va.</p>
      <div class="sort-bank">${B.map(i=>{ const it=s.items[i]; return `<button class="chip ${it[2]?'has-ill':''}" data-c="${i}" aria-pressed="false">${it[2]?ILL(it[2]):''}${it[0]}</button>`; }).join('')}</div>`;
  } else if(s.t==='order'){
    const B = s._b || (s._b = shuffle(s.items.map((_,i)=>i)));
    html=`${eyebrow}<h2>${s.q}</h2><div class="order-slot" id="slot" aria-label="Tu respuesta"></div><div class="bank">${B.map(i=>`<button class="chip" data-c="${i}">${s.items[i]}</button>`).join('')}</div>`;
  }
  const footer = (s.t==='match'||s.t==='sort') ? `<p style="text-align:center;color:var(--muted);font-weight:700">${s.t==='match'?'Une todas las parejas':'Ubica todas las tarjetas'}</p>` : `<button class="btn go" id="l-go" ${needs||s.t==='explore'?'disabled':''}>${btn}</button>`;
  $layer.innerHTML = `<div class="lesson" role="dialog" aria-label="${esc(L.lesson.title)}"><div class="lesson-in">
    <div class="l-top"><button class="x" id="l-x" aria-label="Salir de la lección">${I.x}</button><div class="bar"><i style="width:${prog}%"></i></div>${noHeartsMode()?'':`<span class="stat heart">${I.heart}${S.hearts}</span>`}</div>
    <div class="l-body">${html}</div>
    <div class="l-foot" id="foot">${footer}</div></div></div>`;
  document.getElementById('l-x').onclick=confirmExit;
  document.querySelector('.l-body').scrollTop=0;
  wireStep(s);
}
function confirmExit(){
  if(!L) return;
  if(L.phase==='pro') return finishLesson(null);
  const lose = !noHeartsMode() && (L.idx>0 || L.answered>0);
  const half = L.idx/L.queue.length >= .5;
  modal(`<div class="row">${wd('triste','sad')}<div><h2>¿Ya te vas?</h2><p>${half?'¡Ya vas por la mitad! ':''}Si sales ahora pierdes lo que llevas de esta lección${lose?' y <b>una vida</b>':''}.</p>${lose?`<p class="hearts">${I.heart}${S.hearts} → ${Math.max(0,S.hearts-1)}</p>`:''}</div></div>
    <button class="btn go" data-m="stay">Seguir aprendiendo</button><button class="btn ghost" data-m="leave">${lose?'Salir y perder una vida':'Salir'}</button>`,
    v=>{ if(v!=='leave') return; if(lose){ if(S.hearts===5) S.heartsTs=Date.now(); S.hearts=Math.max(0,S.hearts-1); } L=null; saveS(); render(); });
}
function wireStep(s){
  const go=document.getElementById('l-go');
  const msg=(t,c='')=>{ const m=document.getElementById('imsg'); if(m){ m.textContent=t; m.className='inline-msg '+c; } };
  const buzz=()=>{ try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} };
  if(s.t==='learn'){ go.onclick=()=>next(); return; }
  if(s.t==='explore'){
    document.querySelectorAll('.xc').forEach(b=>b.onclick=()=>{ b.setAttribute('aria-expanded','true'); b.querySelector('.d').hidden=false; b.querySelector('.tap').hidden=true; L.state.seen.add(b.dataset.x); tone([[660,.06]]);
      document.getElementById('xcnt').textContent=`${L.state.seen.size}/${s.cards.length}`; if(L.state.seen.size===s.cards.length) go.disabled=false; });
    go.onclick=()=>next(); return;
  }
  if(s.t==='mc'||s.t==='tf'||s.t==='pic'){
    const sel = s.t==='pic' ? '.pic' : '.opt';
    document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{ document.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); L.state.sel=+b.dataset.o; go.disabled=false; });
    go.onclick=()=>{ const isOk=v=> s.t==='tf' ? (v===1)===s.a : v===s.a; const ok=isOk(L.state.sel);
      document.querySelectorAll(sel).forEach(b=>{ b.disabled=true; const v=+b.dataset.o; if(isOk(v)) b.classList.add('right'); else if(b.getAttribute('aria-pressed')==='true') b.classList.add('wrong'); if(s.t==='pic') b.querySelector('.lbl').textContent=s.o[v][1]; });
      feedback(ok, s); };
    return;
  }
  if(s.t==='fill'){
    const blank=document.getElementById('blank');
    document.querySelectorAll('.fill-opts .chip').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.fill-opts .chip').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); L.state.sel=+b.dataset.o; blank.textContent=s.o[L.state.sel]; go.disabled=false; });
    go.onclick=()=>{ const ok=L.state.sel===s.a; blank.classList.add(ok?'right':'wrong'); if(!ok) blank.textContent=s.o[s.a]; document.querySelectorAll('.fill-opts .chip').forEach(b=>b.disabled=true); feedback(ok,s); };
    return;
  }
  if(s.t==='slider'){
    const r=document.getElementById('srange'), out=document.getElementById('sval'), st=s.step||1;
    const fmt=v=>(st<1?(+v).toFixed(1):Math.round(v))+(s.unit||'');
    r.oninput=()=>{ out.textContent=fmt(r.value); go.disabled=false; };
    go.onclick=()=>{ const v=+r.value, ok=v>=s.range[0]-1e-9 && v<=s.range[1]+1e-9; r.disabled=true; document.getElementById('sld').classList.add('done');
      out.style.color= ok?'var(--go)':'var(--bad)'; feedback(ok, {...s, why:`${s.why} Marcaste ${fmt(v)}.`}); };
    return;
  }
  if(s.t==='match'){
    const st=L.state;
    document.querySelectorAll('.mt').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('ok')) return;
      const isL = b.dataset.l!==undefined, v=+(isL?b.dataset.l:b.dataset.r);
      if(isL){ document.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); st.left=v; msg('Ahora toca su pareja a la derecha.'); return; }
      if(st.left===null){ msg('Primero toca un elemento de la izquierda.','bad'); b.classList.add('no'); setTimeout(()=>b.classList.remove('no'),450); return; }
      const lb=document.querySelector(`[data-l="${st.left}"]`);
      if(v===st.left){
        [lb,b].forEach(x=>{ x.classList.remove('sel'); x.classList.add('ok'); x.disabled=true; x.insertAdjacentHTML('beforeend',`<span class="mk">${I.check}</span>`); });
        st.matched.push(v); st.left=null; tone([[740,.08]]); msg('¡Pareja correcta!','good');
        if(st.matched.length===s.pairs.length) feedback(!st.err, s, 'match');
      } else {
        st.err=true; SFX.bad(); buzz(); msg('Esa pareja no va. Prueba otra.','bad');
        [lb,b].forEach(x=>{ x.classList.remove('sel'); x.classList.add('no'); x.insertAdjacentHTML('beforeend',`<span class="mk">${I.x}</span>`); });
        setTimeout(()=>{ [lb,b].forEach(x=>{ x.classList.remove('no'); x.querySelector('.mk')?.remove(); }); },900); st.left=null;
      }
    });
    return;
  }
  if(s.t==='sort'){
    const st=L.state; let chip=null;
    document.querySelectorAll('.sort-bank .chip').forEach(c=>c.onclick=()=>{ document.querySelectorAll('.sort-bank .chip').forEach(x=>x.setAttribute('aria-pressed','false')); c.setAttribute('aria-pressed','true'); chip=c; document.querySelectorAll('.bucket').forEach(b=>b.classList.add('armed')); msg(`¿Dónde va “${s.items[+c.dataset.c][0]}”?`); });
    document.querySelectorAll('.bucket').forEach(bk=>bk.onclick=()=>{
      if(!chip){ msg('Primero toca una tarjeta.','bad'); return; }
      const it=s.items[+chip.dataset.c], g=+bk.dataset.g;
      if(it[1]===g){
        document.getElementById('bin-'+g).insertAdjacentHTML('beforeend',`<span class="chip">${it[0]}</span>`);
        const cnt=document.getElementById('bc-'+g); cnt.textContent=+cnt.textContent+1;
        chip.remove(); chip=null; st.placed++; tone([[740,.08]]); msg('¡Bien ubicada!','good');
        document.querySelectorAll('.bucket').forEach(b=>b.classList.remove('armed'));
        if(st.placed===s.items.length) feedback(!st.err, s, 'sort');
      } else {
        st.err=true; SFX.bad(); buzz(); msg(`“${it[0]}” no va en “${s.groups[g]}”. Prueba otro grupo.`,'bad');
        bk.classList.add('flash'); chip.classList.add('no'); const c=chip; setTimeout(()=>{ bk.classList.remove('flash'); c.classList.remove('no'); },600);
      }
    });
    return;
  }
  if(s.t==='order'){
    const slot=document.getElementById('slot');
    const redraw=()=>{ slot.innerHTML=L.state.picked.map(i=>`<button class="chip" data-p="${i}">${s.items[i]}</button>`).join('');
      document.querySelectorAll('.bank .chip').forEach(c=>c.classList.toggle('ghosted', L.state.picked.includes(+c.dataset.c)));
      slot.querySelectorAll('[data-p]').forEach(c=>c.onclick=()=>{ L.state.picked=L.state.picked.filter(x=>x!==+c.dataset.p); redraw(); });
      go.disabled = L.state.picked.length!==s.items.length; };
    document.querySelectorAll('.bank .chip').forEach(c=>c.onclick=()=>{ const i=+c.dataset.c; if(!L.state.picked.includes(i)){ L.state.picked.push(i); redraw(); } });
    go.onclick=()=>{ const ok=L.state.picked.every((v,i)=>v===i); slot.querySelectorAll('.chip').forEach((c,i)=>{ c.disabled=true; c.style.borderColor = (+c.dataset.p===i)?'var(--go)':'var(--bad)'; }); document.querySelectorAll('.bank .chip').forEach(c=>c.disabled=true); feedback(ok,s); };
  }
}
const PRAISE=['¡Bien hecho!','¡Excelente!','¡Así se cultiva!','¡Perfecto!','¡Vas creciendo!'];
const CHEER=['Casi. Así es:','Tranqui, aprende de esto:','Ups. Fíjate en esto:'];
function feedback(ok, s, kind){
  const isPro = L.phase==='pro';
  if(!L.retried.has(L.idx) && !isPro){ L.answered++; if(ok) L.firstTry++; }
  if(ok) SFX.ok(); else {
    SFX.bad(); L.mistakes++;
    if(!noHeartsMode() && !isPro){ if(S.hearts===5) S.heartsTs=Date.now(); S.hearts=Math.max(0,S.hearts-1); saveS(); }
    if(!isPro && !L.opts.exam && !L.retried.has(L.idx)){ L.queue.push({...s}); L.retried.add(L.queue.length-1); }
  }
  const foot=document.getElementById('foot');
  foot.className='l-foot '+(ok?'good':'fail');
  const why = kind==='match' ? (ok?'Todas las parejas correctas.':'Te equivocaste en alguna pareja. La repasaremos al final.') : kind==='sort' ? (ok?(s.why||'Todo en su lugar.'):`Hubo tarjetas en el grupo equivocado. ${s.why||''} La repasaremos al final.`) : (s.why||'');
  const title = ok ? PRAISE[Math.floor(Math.random()*PRAISE.length)] : CHEER[Math.floor(Math.random()*CHEER.length)];
  const out = !ok && !noHeartsMode() && !isPro && S.hearts<=0;

function lote(start){ const d=(start||today()).replace(/-/g,'').slice(2); return 'RX-'+d+'-'+Math.random().toString(36).slice(2,5).toUpperCase(); }
function newCrop(f){
  const start=f.start||today(), stage=f.stage||'germinacion';
  const c={id:uid(), code:lote(start), name:f.name||'Mi cultivo', variety:f.variety||'', kind:f.kind||'foto', seed:f.seed||'feminizada', origin:f.origin||'semilla', medium:f.medium||'tierra', env:f.env||'indoor', plants:f.plants||1, start, stage, stages:[], logs:[], harvest:{}, status:'activo', createdAt:Date.now(), updatedAt:Date.now()};
  const si=STG.findIndex(s=>s.id===stage);

}
const stageIdx = c => STG.findIndex(s=>s.id===c.stage);
const stageObj = id => STG.find(s=>s.id===id);
const stageDate = (c,id) => { const e=[...c.stages].reverse().find(s=>s.s===id); return e?e.d:null; };
const flowerDay1 = c => stageDate(c,'prefloracion') || stageDate(c,'floracion');
const cropById = id => CROPS.find(c=>c.id===id);
function lastWith(c, field){ const l=[...c.logs].filter(x=>x[field]!==undefined&&x[field]!==null).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).pop(); return l||null; }
function cropAgeLine(c){
  const d=Math.max(0,daysBetween(c.start,today())), f1=flowerDay1(c), si=stageIdx(c);
  let extra='';
  if(f1 && si>=3 && si<=5) extra=` · semana ${Math.floor(Math.max(0,daysBetween(f1,today()))/7)+1} de floración`;
  else if(c.stage==='secado'){ const h=stageDate(c,'secado'); extra=` · día ${Math.max(0,daysBetween(h,today()))+1} de secado`; }
  else if(c.stage==='curado'){ const h=stageDate(c,'curado'); extra=` · semana ${Math.floor(Math.max(0,daysBetween(h,today()))/7)+1} de curado`; }
  return {d, txt:`Día ${d}${extra}`};
}
function evalRange(v, r){ if(v===null||!r) return null; if(v<r[0]) return 'Bajo'; if(v>r[1]) return 'Alto'; return 'En rango'; }
function phRange(c){ return c.stage==='germinacion'?[5.8,6.2]:(PH[c.medium]||PH.tierra); }
function alertsFor(c){
  const r=RANGE[c.stage]; if(!r) return [];
  const out=[], lc=lastWith(c,'temp'), lh=lastWith(c,'hum'), lp=lastWith(c,'ph'), le=lastWith(c,'ec');
  const recent = l => l && daysBetween(l.d,today())<=3;
  const word=(ev,fem)=> ev==='Alto' ? (fem?'alta':'alto') : (fem?'baja':'bajo');
  if(recent(lc) && evalRange(lc.temp,r.t)!=='En rango') out.push(`Temperatura ${word(evalRange(lc.temp,r.t),true)}: ${lc.temp}°C (ideal ${r.t[0]}–${r.t[1]}°C)`);
  if(recent(lh) && evalRange(lh.hum,r.h)!=='En rango') out.push(`Humedad ${word(evalRange(lh.hum,r.h),true)}: ${lh.hum}% (ideal ${r.h[0]}–${r.h[1]}%)`);
  if(recent(lp) && GROWING.includes(c.stage) && evalRange(lp.ph,phRange(c))!=='En rango') out.push(`pH ${word(evalRange(lp.ph,phRange(c)),false)}: ${lp.ph} (ideal ${phRange(c).join('–')})`);
  if(recent(le) && r.ec && evalRange(le.ec,r.ec)!=='En rango') out.push(`EC ${word(evalRange(le.ec,r.ec),true)}: ${le.ec} (ideal ${r.ec.join('–')})`);

}
function computeTasks(c){
  if(c.status==='finalizado') return [];
  const t=[], st=c.stage, td=today();
  const growing=GROWING.includes(st);
  if((growing||st==='secado'||st==='curado') && !c.logs.some(l=>l.d===td && (l.temp!==undefined||l.hum!==undefined))) t.push('Registra la temperatura y la humedad de hoy.');
  if(growing && st!=='germinacion'){ const lp=[...c.logs].filter(l=>l.t==='plaga').sort((a,b)=>a.d<b.d?-1:1).pop(); if(!lp || daysBetween(lp.d,td)>=7) t.push('Inspección semanal de plagas: revisa el envés de las hojas con lupa (Cap. 12).'); }
  const f1=flowerDay1(c);
  if(st==='prefloracion') t.push('Revisa si hay sacos de polen (machos) y haz lollipop si aún no lo hiciste (Cap. 9 y 13).');
  if((st==='floracion'||st==='maduracion') && f1 && daysBetween(f1,td)>=35) t.push('Revisa los tricomas con lupa de 60x: 70% lechosos + 30% ámbar es el pico (Cap. 13).');
  if(st==='secado'){ const h=stageDate(c,'secado'); if(h && daysBetween(h,td)>=9) t.push('Haz la prueba del tallo: si se quiebra con un “snap”, pasa al curado (Cap. 15).'); }
  if(st==='curado'){ const h=stageDate(c,'curado'); const d=h?daysBetween(h,td):0; t.push(d<7?'Abre los frascos 2–3 veces hoy por 10 minutos (burping, Cap. 16).':'Abre los frascos cada pocos días y revisa la humedad interna (58–62%).'); if(d>=28) t.push('Ya llevas 4 semanas de curado: completa la ficha de cata.'); }

}
function computePlan(c){
  const out=[], td=today(), auto=c.kind==='auto', si=stageIdx(c);
  const st=(id)=>stageDate(c,id), state=(idx)=> si>idx?'done':si===idx?'now':'next';
  const range=(a,b)=>`${fmtD(a)} – ${fmtD(b)}`;
  out.push({l:'Germinación', w:st('germinacion')?fmtD(st('germinacion')):'', n:'La semilla despierta en 3–7 días.', s:state(0)});
  const pl = st('plantula') || addDays(c.start,5);
  out.push({l:'Plántula', w:st('plantula')?fmtD(st('plantula')):range(addDays(c.start,3),addDays(c.start,7)), n:'1–2 semanas. Sin nutrientes hasta el 2.º o 3.er par de hojas.', s:state(1)});

    out.push({l:'Floración', w:f1?fmtD(f1):'', n:'Empieza sola por la edad de la planta; no requiere 12/12.', s:si>=3&&si<=5?'now':si>5?'done':'next'});
    const h1=addDays(c.start,60), h2=addDays(c.start,90);
    if(si<6){ out.push({l:'Flush (lavado de raíces)', w:range(addDays(h1,-14),addDays(h2,-10)), n:'Solo agua con pH ajustado 10–14 días antes de cosechar.', s:si===5?'now':'next'});
      out.push({l:'Cosecha estimada', w:range(h1,h2), n:'Ciclo total de 60–90 días. Confírmalo con los tricomas.', s:'next'}); }
  } else {
    const est = f1 || addDays(vg,28);
    out.push({l:'Cambio a 12/12 (Día 1 de floración)', w:f1?fmtD(f1):`desde ${fmtD(est)}`, n:'Oscuridad total durante las 12 horas.', s:si>=3?'done':'next'});
    if(si<6){ const h1=addDays(est,56), h2=addDays(est,84);
      out.push({l:'Revisar tricomas', w:`desde ${fmtD(addDays(est,35))}`, n:'Desde la semana 6 de floración, con lupa de 60x.', s:si>=4&&daysBetween(est,td)>=35?'now':'next'});
      out.push({l:'Flush (lavado de raíces)', w:range(addDays(h1,-14),addDays(h2,-10)), n:'Solo agua con pH ajustado 10–14 días antes de cosechar.', s:si===5?'now':'next'});
      out.push({l:'Cosecha estimada', w:range(h1,h2), n:'8–12 semanas de floración según la genética. Observa los tricomas, no el calendario.', s:'next'}); }

  const hv=st('secado');
  if(hv){ out.push({l:'Cosecha', w:fmtD(hv), n:'Justo antes de encender las luces.', s:'done'}); out.push({l:'Secado', w:range(addDays(hv,10),addDays(hv,14)), n:'10–14 días a 15–18°C y 55–60% en oscuridad.', s:state(6)}); }
  const cu=st('curado');
  if(cu){ out.push({l:'Curado mínimo', w:`hasta ${fmtD(addDays(cu,28))}`, n:'4 semanas en frascos al 75%, humedad 58–62%.', s:state(7)}); out.push({l:'Ficha de cata', w:`desde ${fmtD(addDays(cu,28))}`, n:'Evalúa ceniza, suavidad, aroma y efecto.', s:c.harvest?.cata?'done':'next'}); }
  return out;
}

function lastLog(c, t){ return [...c.logs].filter(l=>l.t===t).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).pop()||null; }

function lineChart(c, field, band, unit, color){

    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${(y(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-body)">${t}</text>`).join('')}

function logLine(l){

  if(l.temp!==undefined) parts.push(`${l.temp}°C`); if(l.hum!==undefined) parts.push(`HR ${l.hum}%`);
  if(l.liters!==undefined) parts.push(`${l.liters} L`); if(l.ph!==undefined) parts.push(`pH ${l.ph}`); if(l.ec!==undefined) parts.push(`EC ${l.ec}`);
  if(l.tech) parts.push(`<b>${esc(l.tech)}</b>`);
  if(l.t==='plaga') parts.push(l.pest?`<b>${esc(l.pest)}</b> detectada`:'Revisión sin plagas');

  const h=c.harvest||{};
  let extra='';
  if(nx.id==='prefloracion') extra = c.kind==='auto' ? '<p class="hint">Las autoflorecientes florecen solas por su edad; no requieren cambio a 12/12. Registra cuándo ves los primeros pistilos.</p>' : '<p class="hint">Cambia el timer a 12/12. Este es el <b>Día 1 de floración</b>: desde aquí cuentas las semanas.</p>';
  if(nx.id==='maduracion') extra='<p class="hint">En la maduración empieza el flush: solo agua con pH ajustado, 10–14 días antes de cosechar.</p>';
  if(nx.id==='secado') extra=`<p class="hint">Marca la fecha de cosecha. Seca 10–14 días en oscuridad, a 15–18°C y 55–60% de humedad.</p>${fieldH('sf-wet','Peso húmedo (g)',inpH('sf-wet','number',h.wet??'','min="0" step="1" inputmode="numeric"'))}${fieldH('sf-amb','Tricomas ámbar (%)',inpH('sf-amb','number',h.amber??'','min="0" max="100" step="5" inputmode="numeric"'))}`;
  if(nx.id==='curado') extra=`<p class="hint">Pasa al curado cuando el tallo se quiebre con un “snap”. Frascos de vidrio al 75%.</p>${fieldH('sf-dry','Peso seco (g)',inpH('sf-dry','number',h.dry??'','min="0" step="1" inputmode="numeric"'))}`;
  if(nx.id==='finalizado') extra='<p class="hint">Después de al menos 4 semanas de curado. Luego completas la ficha de cata.</p>';
  sheet(`Pasar a ${nx.n}`, `${fieldH('sf-d','Fecha',inpH('sf-d','date',today(),`max="${today()}" min="${c.start}"`))}${extra}${fieldH('sf-note','Nota',inpH('sf-note','text','','maxlength="160" placeholder="Opcional"'))}`, `Confirmar: ${nx.n}`, ()=>{
    const d=val('sf-d')||today();
    c.stage=nx.id; c.stages.push({s:nx.id, d});
    const note=val('sf-note'); c.logs.push({id:uid(), d, t:'etapa', s:nx.id, ...(note?{note}:{})});
    c.harvest=c.harvest||{};
    if(nx.id==='secado'){ const w=num(val('sf-wet')), a=num(val('sf-amb')); if(w!==null) c.harvest.wet=w; if(a!==null) c.harvest.amber=a; c.harvest.date=d; }
    if(nx.id==='curado'){ const w=num(val('sf-dry')); if(w!==null) c.harvest.dry=w; }
    if(nx.id==='finalizado') c.status='finalizado';
    saveCrop(c); saveS(); closeSheet(); toast(`${c.name}: ${nx.n}`);
    if(nx.id==='finalizado' && !c.harvest.cata) setTimeout(()=>cataForm(c),50);
  });
}
function cataForm(c){
  const k=(c.harvest&&c.harvest.cata)||{};
  sheet('Ficha de cata', `<p class="hint">Úsala después de al menos 4 semanas de curado.</p>
    ${groupH('Aspecto visual',chipH('ct-vis',['Muy resinoso','Denso','Colores morado/naranja'],k.visual))}
    ${groupH('Aroma',chipH('ct-aro',['Cítrico','Dulce','Gas/Fuel','Frutal','Terroso'],k.aroma))}
    ${groupH('Color de ceniza',segH('ct-ash',[['Blanca','Blanca (limpia)'],['Gris','Gris'],['Negra','Negra (sales)']],k.ash||'',true))}
    ${groupH('Suavidad',segH('ct-smo',[['Seda','Seda'],['Media','Media'],['Raspa','Raspa']],k.smooth||'',true))}
    ${groupH('Efecto',chipH('ct-eff',['Cerebral/activo','Relajante','Creativo'],k.effect))}
    ${fieldH('ct-dry','Peso final seco (g)',inpH('ct-dry','number',c.harvest?.dry??'','min="0" step="1" inputmode="numeric"'))}
    ${groupH('Calificación general',segH('ct-gr',['Excelente','Muy bueno','Bueno','Regular','Mejorable'].map(x=>[x,x]),k.grade||''))}
    ${fieldH('ct-note','Notas',`<textarea id="ct-note" rows="3" maxlength="400">${esc(k.note||'')}</textarea>`)}`, 'Guardar ficha', ()=>{
    const grade=segV('ct-gr'); if(!grade) return 'Elige una calificación general.';
    c.harvest=c.harvest||{};
    c.harvest.cata={visual:chipV('ct-vis'), aroma:chipV('ct-aro'), ash:segV('ct-ash'), smooth:segV('ct-smo'), effect:chipV('ct-eff'), grade, note:val('ct-note'), d:today()};
    const dry=num(val('ct-dry')); if(dry!==null) c.harvest.dry=dry;
    saveCrop(c); const b=checkBadges(); saveS(); closeSheet();
    const tip = c.harvest.cata.ash==='Negra'?'Ceniza negra: alarga el flush la próxima vez.':c.harvest.cata.smooth==='Raspa'?'Raspa: faltó lavado o un secado más lento.':'';
    toast(b.length?`Logro: ${b[0].name}`:tip||'Ficha de cata guardada');
  });
}

/* ---------- Ficha del cultivo y exportación ---------- */
function stats(c, f){ const v=c.logs.map(l=>l[f]).filter(x=>typeof x==='number'); if(!v.length) return null; const avg=v.reduce((a,b)=>a+b,0)/v.length; return {n:v.length, avg:Math.round(avg*10)/10, min:Math.min(...v), max:Math.max(...v)}; }
function fichaText(c){
  const L2=[], st=(f,u)=>{ const s=stats(c,f); return s?`promedio ${s.avg}${u} (mín ${s.min}${u} · máx ${s.max}${u}, ${s.n} registros)`:'sin registros'; };
  L2.push('FICHA DE TU CULTIVO · CULTIVA CON ROXS','',`Lote: ${c.code}`,`Cultivo: ${c.name}`,`Variedad: ${c.variety||'—'}`,`Tipo: ${KIND[c.kind]} ${c.seed} · Origen: ${c.origin}`,`Sustrato: ${MEDIUM[c.medium]} · Entorno: ${ENVS[c.env]} · Plantas: ${c.plants}`,`Estado: ${stageObj(c.stage).n}`,'');
  L2.push('ETAPAS'); c.stages.forEach(s=>L2.push(`- ${fmtDY(s.d)}  ${stageObj(s.s)?.n||s.s}`)); L2.push('');
  L2.push('CLIMA',`- Temperatura: ${st('temp','°C')}`,`- Humedad: ${st('hum','%')}`,'');
  L2.push('RIEGO Y NUTRICIÓN',`- pH: ${st('ph','')}`,`- EC: ${st('ec','')}`);
  c.logs.filter(l=>l.nutr).sort((a,b)=>a.d<b.d?-1:1).forEach(l=>L2.push(`- ${fmtDY(l.d)}  ${l.nutr}`)); L2.push('');
  L2.push('TÉCNICAS APLICADAS'); const te=c.logs.filter(l=>l.tech).sort((a,b)=>a.d<b.d?-1:1); te.length?te.forEach(l=>L2.push(`- ${fmtDY(l.d)}  ${l.tech}${l.note?' · '+l.note:''}`)):L2.push('- Ninguna registrada'); L2.push('');
  L2.push('MONITOREO DE PLAGAS'); const pg=c.logs.filter(l=>l.t==='plaga').sort((a,b)=>a.d<b.d?-1:1); pg.length?pg.forEach(l=>L2.push(`- ${fmtDY(l.d)}  ${l.pest?l.pest+' detectada'+(l.treat?' · tratamiento: '+l.treat:''):'Sin plagas'}`)):L2.push('- Sin inspecciones registradas'); L2.push('');
  const h=c.harvest||{}, hv=stageDate(c,'secado'), cu=stageDate(c,'curado');
  L2.push('COSECHA Y POSTCOSECHA',`- Fecha de cosecha: ${hv?fmtDY(hv):'—'}`,`- Peso húmedo: ${h.wet?h.wet+' g':'—'}`,`- Tricomas ámbar: ${h.amber!=null?h.amber+'%':'—'}`,`- Días de secado: ${hv&&cu?daysBetween(hv,cu):'—'}`,`- Peso seco: ${h.dry?h.dry+' g':'—'}`,`- Inicio de curado: ${cu?fmtDY(cu):'—'}`,'');
  if(h.cata){ const k=h.cata; L2.push('FICHA DE CATA',`- Aspecto: ${(k.visual||[]).join(', ')||'—'}`,`- Aroma: ${(k.aroma||[]).join(', ')||'—'}`,`- Ceniza: ${k.ash||'—'} · Suavidad: ${k.smooth||'—'}`,`- Efecto: ${(k.effect||[]).join(', ')||'—'}`,`- Calificación: ${k.grade}`,k.note?`- Notas: ${k.note}`:'',''); }
  L2.push('OBSERVACIONES'); const ob=c.logs.filter(l=>l.t==='nota').sort((a,b)=>a.d<b.d?-1:1); ob.length?ob.forEach(l=>L2.push(`- ${fmtDY(l.d)}  ${[l.height!==undefined?l.height+' cm':'',l.status||'',l.note||''].filter(Boolean).join(' · ')}`)):L2.push('- Sin observaciones');
  L2.push('',`Generado el ${fmtDY(today())} con Cultiva con ROXS.`);
  return L2.filter(x=>x!==undefined).join('\n');
}
function csvText(c){
  const cols=['fecha','tipo','temp_c','humedad_pct','agua_l','ph','ec','nutrientes','tecnica','plaga','tratamiento','altura_cm','estado','etapa','nota'];
  const q=v=>{ if(v===undefined||v===null) return ''; const s=String(v); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=[...c.logs].sort((a,b)=>a.d<b.d?-1:1).map(l=>[l.d,l.t,l.temp,l.hum,l.liters,l.ph,l.ec,l.nutr,l.tech,l.pest,l.treat,l.height,l.status,l.s?stageObj(l.s)?.n:'',l.note].map(q).join(','));
  return [`# Lote ${c.code} · ${c.name}`, cols.join(','), ...rows].join('\n');
}
async function offerFile(filename, data){
  if(window.claude && typeof window.claude.use==='function'){
    try{ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename, data}); return 'ok'; } }
    catch(e){ if(e && e.code && e.code!=='unavailable') return 'cancel'; }
    return 'none';
  }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); return 'ok'; }catch(e){ return 'none'; }
}
function fichaView(c){
  UI.view='sheet';
  const txt=fichaText(c), safe=c.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'cultivo';
  $layer.innerHTML=`<div class="lesson" role="dialog" aria-label="Ficha de tu cultivo"><div class="lesson-in">
    <div class="l-top"><button class="x" id="fv-x" aria-label="Cerrar">${I.x}</button><h2 style="font-size:18px;flex:1">Ficha de tu cultivo</h2></div>
    <div class="l-body"><div class="ficha"><div class="card"><span class="eyebrow">Lote ${c.code}</span><h3>${esc(c.name)}</h3><dl class="kv"><dt>Variedad</dt><dd>${esc(c.variety||'—')}</dd><dt>Tipo</dt><dd>${KIND[c.kind]} ${c.seed}</dd><dt>Sustrato</dt><dd>${MEDIUM[c.medium]} · ${ENVS[c.env]}</dd><dt>Registros</dt><dd>${c.logs.filter(l=>l.t!=='etapa').length}</dd></dl></div>
      <textarea class="copybox" id="fv-txt" readonly aria-label="Ficha en texto">${esc(txt)}</textarea>
      <div class="row-btns"><button class="btn" id="fv-txtdl">${I.dl}Ficha .txt</button><button class="btn ghost" id="fv-csv">${I.dl}Datos .csv</button></div>
      <button class="btn ghost" id="fv-copy">${I.copy}Copiar ficha</button><p class="hint" id="fv-msg"></p></div></div></div></div>`;
  document.getElementById('fv-x').onclick=closeSheet;
  const msg=t=>{ document.getElementById('fv-msg').textContent=t; };
  document.getElementById('fv-copy').onclick=()=>{ const ta=document.getElementById('fv-txt'); try{ navigator.clipboard.writeText(txt).then(()=>msg('Ficha copiada.'),()=>{ ta.select(); msg('Selecciona y copia el texto de arriba.'); }); }catch(e){ ta.select(); msg('Selecciona y copia el texto de arriba.'); } };
  document.getElementById('fv-txtdl').onclick=async()=>{ const r=await offerFile(`ficha-${c.code}-${safe}.txt`, txt); if(r==='none') msg('Aquí no se pueden descargar archivos. Usa “Copiar ficha”.'); };
  document.getElementById('fv-csv').onclick=async()=>{ const r=await offerFile(`datos-${c.code}-${safe}.csv`, csvText(c)); if(r==='none') msg('Aquí no se pueden descargar archivos. Usa “Copiar ficha”.'); };
}

/* ---------- Logros y perfil ---------- */
function renderBadges(){
  const lv=level(), prevT=lv.i*LVL_XP, pct=Math.min(100,(S.xp-prevT)/LVL_XP*100);
  $app.innerHTML = topbar() + `<h1 class="page-h">Logros</h1><p class="page-sub">${S.badges.length} de ${BADGES.length} desbloqueados</p>
  <div class="card" style="display:grid;gap:10px;margin-bottom:22px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-family:var(--f-display);font-size:16px">Nivel ${lv.i+1}: ${lv.name}</b><span style="font-weight:800;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums">${S.xp}/${lv.next} XP</span></div><div class="goal" style="margin:0"><div class="track"><div class="fill" style="width:${pct}%"></div></div></div></div>
  <div class="badges">${BADGES.map(b=>{const on=S.badges.includes(b.id); return `<div class="bdg ${on?'':'off'}"><div class="medal">${on?I[b.icon]:I.lock}</div><b>${b.name}</b><small>${b.desc}</small></div>`;}).join('')}</div>`;
}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; if(S.tab==='me' && !UI.view && !L) render(); });
function renderMe(){
  const lv=level(), p=PURPOSES[S.purpose]||PURPOSES.terapeutico;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  $app.innerHTML = topbar() + `<div class="prof-head">${wd('saludando','still',78)}<div><h1 style="font-size:22px">Cultivador ${p.name.toLowerCase()}</h1><p class="lvl">Nivel ${lv.i+1} · ${lv.name}</p></div></div>
  <div class="statgrid">
    <div class="sg" style="color:#F28A00">${I.flame}<div><div class="big-num" style="color:var(--ink)">${curStreak()}</div><small>Días de racha</small></div></div>
    <div class="sg" style="color:var(--sun-deep)">${I.bolt}<div><div class="big-num" style="color:var(--ink)">${S.xp}</div><small>XP total</small></div></div>
    <div class="sg" style="color:var(--go)">${I.check}<div><div class="big-num" style="color:var(--ink)">${doneCount()}/${ALL_LESSONS.length}</div><small>Lecciones</small></div></div>
    <div class="sg" style="color:var(--primary)">${I.pot}<div><div class="big-num" style="color:var(--ink)">${CROPS.length}</div><small>Cultivos</small></div></div>
  </div>
  <div style="margin-top:20px">
    <div class="setting"><span>Meta diaria</span>${selH('goal-s',[['15','15 XP','Relajado: 1 lección al día'],['30','30 XP','Normal: 2 lecciones al día'],['50','50 XP','Intenso: 3 o más lecciones']],String(S.goal),'Meta diaria')}</div>
    <div class="setting"><span>Enfoque de cultivo</span>${selH('pur-s',Object.entries(PURPOSES).map(([k,v])=>[k,v.name,v.focus]),S.purpose||'terapeutico','Enfoque de cultivo')}</div>
    <div class="setting"><span>Sonidos</span><button class="switch" id="snd" role="switch" aria-checked="${S.sound}" aria-label="Sonidos"></button></div>
    <div class="setting"><span>Tus datos</span><span style="font-size:13px;color:var(--muted);text-align:right">${Cloud.on&&!Cloud.failed?'Guardados en tu cuenta':'Guardados en este dispositivo'}</span></div>
  </div>
  ${standalone||window.claude?'':`<div class="card" style="margin-top:22px;display:grid;gap:12px"><div style="display:flex;gap:10px;align-items:center"><span style="width:26px;display:inline-flex;color:var(--primary)">${I.dl}</span><b>Instala la app</b></div>
    <p style="font-size:14px;color:var(--muted)">${deferredInstall?'Agrégala a tu pantalla de inicio y úsala sin conexión.':isIOS?'En Safari, toca Compartir y luego “Agregar a inicio”.':'En el menú del navegador, elige “Instalar app” o “Agregar a pantalla de inicio”.'}</p>${deferredInstall?'<button class="btn" id="inst">Instalar</button>':''}</div>`}
  <div style="margin-top:22px;display:grid;gap:8px;justify-items:center"><button class="linkish" id="reset">Reiniciar mi progreso de aprendizaje</button>
  <p class="fine">Contenido basado en el Manual Completo de Cultivo de ROXS Bio Filtros. Solo para mayores de 18 años.</p></div>`;
  wireSelects($app);
  document.getElementById('goal-s').addEventListener('change',e=>{ S.goal=+e.currentTarget.dataset.val; saveS(); toast('Meta actualizada'); });
  document.getElementById('pur-s').addEventListener('change',e=>{ S.purpose=e.currentTarget.dataset.val; saveS(); render(); toast('Enfoque actualizado'); });
  document.getElementById('snd').onclick=()=>{ S.sound=!S.sound; saveS(); render(); };
  document.getElementById('inst')?.addEventListener('click',async()=>{ try{ deferredInstall.prompt(); await deferredInstall.userChoice; }catch(e){} deferredInstall=null; render(); });
  document.getElementById('reset').onclick=()=>modal(`<div class="row">${wd('triste','sad')}<div><h2>¿Reiniciar tu aprendizaje?</h2><p>Se borran tu XP, racha, lecciones y logros. Tus cultivos se conservan.</p></div></div><button class="btn ghost" data-m="no">Cancelar</button><button class="btn bad" data-m="yes">Reiniciar</button>`,
    v=>{ if(v!=='yes') return; const keep={age:true, onboarded:false, deletedCrops:S.deletedCrops}; S=Object.assign(fresh(),keep); saveS(); render(); });
}

/* ---------- Arranque ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(document.getElementById('modal')){ closeModal(); return; } if(L && UI.view==='lesson'){ confirmExit(); return; } }
  if(!L || UI.view!=='lesson' || document.getElementById('modal')) return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){ const o=document.querySelectorAll('.opt:not([disabled]),.pic:not([disabled])')[n-1]; o&&o.click(); }
  if(e.key==='Enter'){ const b=document.getElementById('l-next')||document.getElementById('l-go'); if(b&&!b.disabled&&document.activeElement?.tagName!=='BUTTON'&&document.activeElement?.tagName!=='INPUT'){ e.preventDefault(); b.click(); } }
});
try{ if(!window.claude && 'serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); } }catch(e){}
function start(data){
  load();
  if(data && data.S){ S=Object.assign(fresh(), data.S); if(Array.isArray(data.CROPS)) CROPS=data.CROPS; }
  render();
  cloudInit();
}
try{ window.claude?.hot?.snapshot?.(()=>({S, CROPS})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
