<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLORAMED — Drone View</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root {
    --bg:#F5F9F2;
    --surface:#FFFFFF;
    --surface-alt:#EBF3E8;
    --text:#1B4332;
    --text-dim:rgba(27,67,50,0.50);
    --text-soft:rgba(27,67,50,0.35);
    --green:#2D6A4F;
    --green-light:#40916C;
    --green-glow:rgba(45,106,79,0.25);
    --green-ghost:rgba(45,106,79,0.06);
    --earth:#BC6C25;
    --earth-light:rgba(188,108,37,0.15);
    --warn:#E07A3D;
    --radius:14px;
    --shadow:0 2px 20px rgba(0,0,0,0.05);
    --shadow-hover:0 8px 40px rgba(45,106,79,0.12);
  }
  body {
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  /* ── HEADER ── */
  .drone-header {
    width:100%; max-width:1300px; padding:24px 28px 0;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .drone-status {
    position:absolute; right:28px; top:50%; transform:translateY(-50%);
    background:var(--surface); padding:8px 16px; border-radius:var(--radius);
    border:1px solid rgba(45,106,79,0.12); font-size:0.85rem;
    box-shadow:var(--shadow);
  }
  .drone-status .dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:blink 1.5s infinite; }
  @keyframes blink { 50%{opacity:.3} }
  /* ── MAPA ── */
  .drone-map {
    position:relative; width:100%; max-width:1300px; margin:20px 28px;
    background: var(--surface-alt);
    border-radius:20px; border:1px solid rgba(45,106,79,0.10);
    box-shadow:var(--shadow);
    overflow:hidden;
    aspect-ratio:16/10; min-height:520px;
  }
  /* ── Grid sutil ── */
  .drone-map::before {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(45,106,79,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,106,79,0.04) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
  }
  /* ── Zona base: rectángulo con glow interno ── */
  .drone-zone {
    position:absolute; border-radius:12px;
    border:2px solid rgba(45,106,79,0.35);
    background:rgba(45,106,79,0.04);
    box-shadow:inset 0 0 40px rgba(45,106,79,0.06), var(--shadow);
    cursor:pointer;
    transition:box-shadow .3s, border-color .3s, transform .2s;
    animation: zonePulse 3s ease-in-out infinite;
  }
  @keyframes zonePulse {
    0%,100% { box-shadow:inset 0 0 40px rgba(45,106,79,0.06), var(--shadow); }
    50%     { box-shadow:inset 0 0 60px rgba(45,106,79,0.12), 0 0 20px rgba(45,106,79,0.08), var(--shadow); }
  }
  .drone-zone:hover {
    border-color:var(--green);
    box-shadow:inset 0 0 60px rgba(45,106,79,0.15), 0 0 30px var(--green-glow);
    transform:scale(1.015);
    z-index:5;
  }
  .drone-zone-label {
    position:absolute; top:8px; left:12px;
    font-family:'Space Grotesk',sans-serif; font-size:0.75rem; font-weight:600;
    color:var(--green); text-shadow:0 0 8px var(--green-glow);
    pointer-events:none;
  }
  /* ── Nave interna ── */
  .drone-nave {
    position:absolute; border-radius:8px;
    border:1px dashed rgba(45,106,79,0.18);
    background:rgba(45,106,79,0.03);
    pointer-events:none;
    transition: box-shadow .4s, border-color .4s;
  }
  /* Nave N1 — Verde bosque */
  .nave-n1 { border-color:rgba(45,106,79,0.4); }
  .zone-g1:hover .nave-n1 {
    box-shadow:inset 0 0 30px rgba(45,106,79,0.20), 0 0 16px rgba(45,106,79,0.25);
    border-color:#2D6A4F;
  }
  /* Nave N2 — Cyan agua */
  .nave-n2 { border-color:rgba(0,180,160,0.4); }
  .zone-g1:hover .nave-n2 {
    box-shadow:inset 0 0 30px rgba(0,180,160,0.20), 0 0 16px rgba(0,180,160,0.25);
    border-color:#00B4A0;
  }
  /* Nave N3 — Ámbar tierra */
  .nave-n3 { border-color:rgba(188,108,37,0.4); }
  .zone-g1:hover .nave-n3 {
    box-shadow:inset 0 0 30px rgba(188,108,37,0.20), 0 0 16px rgba(188,108,37,0.25);
    border-color:#BC6C25;
  }
  .drone-nave-label {
    position:absolute; bottom:4px; left:8px;
    font-size:0.6rem; color:var(--text-dim); pointer-events:none;
  }
  /* ── Panel lateral (tooltip al click) ── */
  .zone-panel {
    position:fixed; top:50%; right:28px; transform:translateY(-50%);
    width:340px; max-width:calc(100vw - 56px);
    background:var(--surface); border:2px solid var(--green);
    border-radius:var(--radius); padding:20px;
    z-index:20; display:none;
    box-shadow:var(--shadow-hover);
  }
  .zone-panel.open { display:block; }
  .zone-panel h3 {
    font-family:'Space Grotesk',sans-serif; font-size:1.1rem; color:var(--green); margin-bottom:4px;
  }
  .zone-panel .close {
    position:absolute; top:12px; right:14px; background:none; border:none;
    color:var(--text-dim); font-size:1.2rem; cursor:pointer;
  }
  .zone-metric {
    display:flex; justify-content:space-between; padding:6px 0;
    border-bottom:1px solid rgba(45,106,79,0.06); font-size:0.85rem;
  }
  .zone-metric span:last-child { font-weight:600; color:var(--green); }
  /* ── Responsive ── */
  @media(max-width:768px){
    .drone-map { aspect-ratio:4/5; }
    .zone-panel { right:10px; width:280px; }
  }
</style>
</head>
<body>

<div class="drone-header">
  <div style="text-align:center; flex:1;">
    <img src="floramed-logo.png" alt="FLORA MED" style="height:52px; width:auto; display:block; margin:0 auto; filter: drop-shadow(0 0 12px rgba(45,106,79,0.35)) brightness(1.15);">
    <div style="font-size:0.72rem;color:var(--text-dim);margin-top:5px;letter-spacing:0.03em;">QUICK-T · Monitoreo inteligente de cultivos</div>
  </div>
  <div class="drone-status">
    <div class="dot"></div> En vivo
  </div>
</div>

<div class="drone-map" id="droneMap">
  <!-- G1 — Invernadero 1 -->
  <div class="drone-zone zone-g1" id="zoneG1" style="top:12%;left:8%;width:46%;height:70%;">
    <div class="drone-zone-label">G1 · INVERNADERO 1</div>
    <!-- Naves internas — glow diferenciado -->
    <div class="drone-nave nave-n1" style="top:6%;left:4%;width:28%;height:88%;">
      <div class="drone-nave-label">N1 · 93×9m</div>
    </div>
    <div class="drone-nave nave-n2" style="top:6%;left:34%;width:34%;height:88%;">
      <div class="drone-nave-label">N2 · 93×16m</div>
    </div>
    <div class="drone-nave nave-n3" style="top:6%;left:70%;width:26%;height:88%;">
      <div class="drone-nave-label">N3 · 93×18m</div>
    </div>
  </div>
</div>

<!-- PANEL LATERAL -->
<div class="zone-panel" id="zonePanel">
  <button class="close" id="panelClose">✕</button>
  <h3 id="panelTitle">G1 — Invernadero 1</h3>
  <div id="panelContent">
    <div class="zone-metric"><span>🌡️ Temperatura</span><span id="mTemp">31.1°C</span></div>
    <div class="zone-metric"><span>💧 Humedad</span><span id="mHum">39.1%</span></div>
    <div class="zone-metric"><span>📊 VPD</span><span id="mVpd">2.76 kPa</span></div>
    <div class="zone-metric"><span>🌱 Plantas activas</span><span id="mPlantas">—</span></div>
    <div class="zone-metric"><span>🧪 pH Fertilizante</span><span id="mPh">—</span></div>
    <div class="zone-metric"><span>⚡ Electroconductividad</span><span id="mEc">—</span></div>
    <div class="zone-metric"><span>🛡️ Fitosanitario</span><span id="mFito">—</span></div>
  </div>
</div>

<script>
const panel = document.getElementById('zonePanel');
document.getElementById('zoneG1').addEventListener('click', function() {
  panel.classList.add('open');
});
document.getElementById('panelClose').addEventListener('click', function() {
  panel.classList.remove('open');
});
// Cerrar click fuera
document.getElementById('droneMap').addEventListener('click', function(e) {
  if (e.target === this) panel.classList.remove('open');
});
</script>

</body>
</html>
